<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>だだんだん工場</title>
<style>
  :root{
    --bg-sky-top:#1c3a52;
    --bg-sky-bot:#f2a93b;
    --amber:#f2a93b;
    --gold:#ffd23f;
    --safe:#7fd8a0;
    --warn:#ffd23f;
    --danger:#ff4d3c;
    --ink:#fff8e7;
    --ink-dim:#c9c2b2;
    --steel:#39424d;
    --steel-dark:#242b32;
    --panel-edge:#2a3644;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:#0c0f13; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic UI","Hiragino Sans",sans-serif;
    display:flex; justify-content:center; touch-action:manipulation; user-select:none;
  }
  #app{
    width:100%; max-width:480px; height:100dvh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,#11151b,#0c0f13);
    position:relative; overflow:hidden;
  }
  #hud{display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px 6px; flex-shrink:0;}
  #score{font-size:14px; color:var(--ink-dim);}
  #score b{font-size:20px; color:var(--gold); font-weight:700; margin:0 3px;}
  #stageLabel{font-size:13px; color:var(--amber); font-weight:700; text-align:right;}

  #gaugeWrap{margin:0 14px 4px; flex-shrink:0;}
  #gaugeTop{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-bottom:3px;}
  #gaugeTrack{
    height:14px; border-radius:8px; background:var(--steel-dark);
    border:1px solid var(--panel-edge); overflow:hidden; position:relative;
  }
  #gaugeBar{height:100%; width:0%; border-radius:8px; background:var(--safe); transition:width .12s linear, background-color .2s;}
  #gaugeTrack.danger #gaugeBar{animation:gaugePulse .35s infinite;}
  @keyframes gaugePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.5);}}
  #gaugeMark{
    position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.55); left:78%;
  }

  #hpWrap{margin:0 14px 8px; flex-shrink:0;}
  #hpTop{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-bottom:3px;}
  #hpTrack{height:10px; border-radius:6px; background:var(--steel-dark); border:1px solid var(--panel-edge); overflow:hidden;}
  #hpBar{height:100%; width:100%; border-radius:6px; background:#5fd0a8; transition:width .15s ease-out, background-color .2s;}
  #hpTrack.hpLow #hpBar{animation:gaugePulse .3s infinite;}

  #stage{
    position:relative; flex:1; margin:0 10px; border-radius:16px; overflow:hidden;
    background:#000; border:1px solid var(--panel-edge);
    transition:box-shadow .15s;
  }
  #stage.danger{box-shadow:inset 0 0 0 3px var(--danger), 0 0 24px rgba(255,60,40,.5); animation:dangerFrame .5s infinite;}
  @keyframes dangerFrame{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,60,40,.9), 0 0 24px rgba(255,60,40,.6);}50%{box-shadow:inset 0 0 0 3px rgba(255,60,40,.3), 0 0 10px rgba(255,60,40,.2);}}
  #game{width:100%; height:100%; display:block; touch-action:manipulation;}

  #banner{
    position:absolute; left:0; right:0; top:9%; text-align:center; pointer-events:none;
    font-size:19px; font-weight:700; letter-spacing:.5px;
    color:var(--ink); text-shadow:0 2px 10px rgba(0,0,0,.6), 0 0 18px rgba(255,180,60,.5);
    opacity:0; transform:translateY(-6px) scale(.94);
    transition:opacity .18s ease-out, transform .18s ease-out;
  }
  #banner.show{opacity:1; transform:translateY(0) scale(1);}
  #banner .sub{display:block; font-size:12px; font-weight:500; color:var(--ink-dim); margin-top:4px;}

  #muteBtn{
    position:absolute; top:10px; right:10px; z-index:5; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.15); color:var(--ink); font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  #endPanel{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(6,8,11,.72); text-align:center; padding:20px; z-index:6;
  }
  #endPanel.show{display:flex;}
  #endTitle{font-size:24px; font-weight:700; margin-bottom:8px;}
  #endStats{font-size:14px; color:var(--ink-dim); line-height:1.7;}

  #controls{flex-shrink:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px;}
  #shipBtn{
    flex:1; padding:16px 0; border:none; border-radius:16px;
    background:linear-gradient(180deg,var(--amber),#c97c1f); color:#241202; font-size:17px; font-weight:700;
    box-shadow:0 4px 0 #8a5814, 0 6px 14px rgba(0,0,0,.4);
  }
  #shipBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a5814, 0 2px 8px rgba(0,0,0,.4);}
  #shipBtn:disabled{opacity:.45;}
  #replayBtn{
    display:none; margin-top:16px; padding:14px 26px; border:none; border-radius:14px;
    background:var(--steel); color:var(--ink); font-size:14px; font-weight:700; box-shadow:0 4px 0 #171c21;
  }
  #replayBtn.show{display:inline-block;}
  #replayBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #171c21;}

  #floaters{position:absolute; inset:0; pointer-events:none;}
  .floater{position:absolute; font-size:16px; font-weight:800; color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,.5); animation:floatUp .9s cubic-bezier(.2,.9,.3,1) forwards;}
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(0) scale(0.4);}
    14%{opacity:1; transform:translateY(-6px) scale(1.35);}
    28%{transform:translateY(-14px) scale(0.92);}
    40%{transform:translateY(-18px) scale(1.08);}
    100%{opacity:0; transform:translateY(-52px) scale(1);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="score">総出荷<b id="scoreVal">0</b>体</div>
    <div id="stageLabel">Lv.1 小さな工場</div>
  </div>
  <div id="gaugeWrap">
    <div id="gaugeTop"><span>在庫</span><span id="gaugeText">0 / 11</span></div>
    <div id="gaugeTrack"><div id="gaugeBar"></div><div id="gaugeMark"></div></div>
  </div>
  <div id="hpWrap">
    <div id="hpTop"><span>🏭 工場HP</span><span id="hpText">100</span></div>
    <div id="hpTrack"><div id="hpBar"></div></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="banner"><span id="bannerMain"></span><span class="sub" id="bannerSub"></span></div>
    <button id="muteBtn">🔊</button>
    <div id="floaters"></div>
    <div id="endPanel">
      <div id="endTitle"></div>
      <div id="endStats"></div>
      <button id="replayBtn">↻ もう一度</button>
    </div>
  </div>
  <div id="controls">
    <button id="shipBtn">🚚 出荷！</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- キャンバス初期化 ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stageEl = document.getElementById('stage');
function resize(){
  const rect = stageEl.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);
  canvas.style.width = rect.width+'px';
  canvas.style.height = rect.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W = rect.width; H = rect.height;
}
let W=0,H=0;
window.addEventListener('resize', resize);

/* ---------- アセット管理: だだんだんの画像(なければCanvasフォールバック) ---------- */
const ASSETS = {
  dandan: 'assets/dandan.PNG',
  enemySmall: 'assets/enemySmall.PNG',
  enemyMedium: 'assets/enemyMedium.PNG',
  enemyLarge: 'assets/enemyLarge.PNG',
  factory: 'assets/factory.PNG',
  conveyor: 'assets/conveyor.PNG',
  material: 'assets/material.PNG',
  truck: 'assets/truck.PNG',
};
const assetImages = {};
let dandanSpriteReady = false;
const enemySpriteReady = {enemySmall:false, enemyMedium:false, enemyLarge:false};
(function loadAssets(){
  Object.keys(ASSETS).forEach(key=>{
    const img = new Image();
    img.onload = ()=>{
      assetImages[key] = {img, ok:true};
      if(key==='dandan') dandanSpriteReady = true;
      if(key in enemySpriteReady) enemySpriteReady[key] = true;
    };
    img.onerror = ()=>{ assetImages[key] = {img:null, ok:false}; };
    img.src = ASSETS[key];
  });
})();
// サイズ別(大/中/小)に縮小したコピーをキャッシュしておき、毎フレームの
// drawImageスケーリングコストを抑える。色の加工は一切行わず、実画像をそのまま使う。
const SPRITE_TIERS = {lg:64, md:32, sm:16};
const scaledCache = {lg:null, md:null, sm:null};
function getScaledDandan(tier){
  if(!dandanSpriteReady) return null;
  if(scaledCache[tier]) return scaledCache[tier];
  const base = assetImages.dandan.img;
  const px = SPRITE_TIERS[tier];
  const c = document.createElement('canvas');
  c.width = px; c.height = px;
  c.getContext('2d').drawImage(base, 0, 0, px, px);
  scaledCache[tier] = c;
  return c;
}
// だだんだん本体を描画。実際の画像をそのまま使い(色の加工はしない)、
// 画像が読み込めない場合のみCanvas円+目にフォールバックする。
function drawDandanSprite(x, y, size, color, drawFace){
  const tier = size>=11 ? 'lg' : (size>=6.5 ? 'md' : 'sm');
  const sprite = getScaledDandan(tier);
  if(sprite){
    ctx.drawImage(sprite, x-size, y-size, size*2, size*2);
    return;
  }
  // フォールバック(画像が読めない場合のみ): 円+目
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.fill();
  ctx.restore();
  if(drawFace!==false && size>=6.5){
    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.beginPath();
    ctx.arc(x-size*0.32, y-size*0.06, size*0.13, 0, Math.PI*2);
    ctx.arc(x+size*0.32, y-size*0.06, size*0.13, 0, Math.PI*2);
    ctx.fill();
  }
}
// 敵画像描画。専用PNGが読めればそれを使い、ダメならタイプ別のCanaフォールバック形状を描く
function drawEnemySprite(type, x, y, r, now){
  const key = {small:'enemySmall', medium:'enemyMedium', large:'enemyLarge'}[type];
  const info = assetImages[key];
  if(info && info.ok){
    const d = r*2;
    ctx.drawImage(info.img, x-r, y-r, d, d);
    return;
  }
  // フォールバック: 画像が無くてもタイプごとに形状を変えて強さの違いを表現
  ctx.save();
  ctx.translate(x,y);
  if(type==='small'){
    ctx.fillStyle='#ff6fa8';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.7,Math.sin(a)*r*0.7); ctx.lineTo(Math.cos(a)*r*1.3,Math.sin(a)*r*1.3); ctx.strokeStyle='#ff6fa8'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,0,r*0.7,0,Math.PI*2); ctx.fill();
  } else if(type==='medium'){
    ctx.fillStyle='#8b6fe0';
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=i*Math.PI/3-Math.PI/2; const px=Math.cos(a)*r, py=Math.sin(a)*r; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle='#b02030';
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8); ctx.lineTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5); ctx.strokeStyle='#7a1420'; ctx.lineWidth=5; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe03c';
    ctx.beginPath(); ctx.arc(-r*0.35,0,r*0.14,0,Math.PI*2); ctx.arc(r*0.35,0,r*0.14,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- サウンド (Web Audio 合成) ---------- */
let actx=null, muted=false;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended'){ actx.resume(); } }
function tone(freq,dur,type,vol,delay,glideTo){
  if(muted || !actx) return;
  const t0 = actx.currentTime + (delay||0);
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type||'square';
  osc.frequency.setValueAtTime(freq, t0);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol||0.12, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxShip(){ tone(300,0.16,'sawtooth',0.13); tone(220,0.5,'sawtooth',0.13,0.05,150); }
function sfxUpgrade(){ tone(380,0.28,'square',0.12,0,980); tone(660,0.22,'triangle',0.08,0.06,1180); }
function sfxRumble(){ tone(55,0.7,'sawtooth',0.14); tone(48,0.5,'sine',0.18,0.15); }
function sfxThud(){ tone(90,0.18,'sine',0.22,0.55); }
function sfxFever(){ [440,660,880,1180].forEach((f,i)=>tone(f,0.16,'square',0.11,i*0.09)); }
function sfxHorn(){ tone(220,0.5,'sawtooth',0.14,0,180); tone(300,0.5,'sawtooth',0.10,0.12,140); }
function sfxAlert(){ tone(880,0.09,'square',0.10); tone(880,0.09,'square',0.10,0.14); }
function sfxBeep(freq){ tone(freq,0.07,'sine',0.09); }
function sfxBoom(){ tone(70,0.5,'sawtooth',0.22); tone(50,0.9,'sine',0.24,0.05); tone(1200,0.12,'square',0.10,0.02); }
function sfxLaser(){ tone(1400,0.09,'sawtooth',0.11,0,500); }
function sfxImpact(){ tone(140,0.22,'square',0.18); tone(90,0.3,'sine',0.16,0.04); }
function sfxGasshan(big){ tone(big?110:180,0.12,'square',big?0.22:0.14); tone(big?60:100,0.35,'sawtooth',big?0.20:0.12,0.03); }
function sfxComplete(n){ tone(900+Math.min(n,10)*12,0.06,'sine',0.09); }
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
});

/* ---------- ステージ定義 (容量オーバーで失敗する仕様) ---------- */
const STAGES = [
  {name:"小さな工場",       robots:1, lines:1, fw:0.30, fh:0.34, press:false, trucks:1, fillRate:1.6,  capacity:11,  ships:1, banner:"操業開始！",              sub:"だだんだん製造、はじまる"},
  {name:"製造機 2台",        robots:2, lines:1, fw:0.34, fh:0.36, press:false, trucks:1, fillRate:2.6,  capacity:16,  ships:2, banner:"製造機、増設！",           sub:""},
  {name:"コンベア 2本",      robots:3, lines:2, fw:0.40, fh:0.40, press:false, trucks:1, fillRate:4.2,  capacity:24,  ships:2, banner:"コンベア、増設！",         sub:""},
  {name:"大型プレス機 稼働", robots:4, lines:2, fw:0.47, fh:0.44, press:true,  trucks:1, fillRate:6.5,  capacity:34,  ships:2, banner:"💥 大型プレス機、登場！！", sub:"ガシャーン！！"},
  {name:"大口注文 発生",     robots:5, lines:3, fw:0.53, fh:0.48, press:true,  trucks:2, fillRate:9.5,  capacity:46,  ships:2, banner:"🚚 大口注文、発生！",      sub:"「もっと出荷を…！」"},
  {name:"大量生産フィーバー", robots:7, lines:3, fw:0.60, fh:0.52, press:true,  trucks:2, fillRate:13.5, capacity:60,  ships:3, banner:"🔥 大量生産フィーバー突入！", sub:"在庫が一気に増えるぞ！"},
];
const RANDOM_EVENTS = [
  {kind:'rate',  banner:"🚨 緊急大量生産！！", sub:"生産速度、急上昇！在庫に注意！", mult:2.2, dur:3000, minStage:1, sfx:sfxAlert, flash:"rgba(255,70,50,0.28)"},
  {kind:'bonus', banner:"🚚 大口注文が入った！", sub:"今出荷すると割増しだ！",        mult:1.6, dur:2600, minStage:0, sfx:sfxHorn,  flash:"rgba(255,210,63,0.22)"},
  {kind:'rate',  banner:"⚠️ コンベア暴走！？",   sub:"一気に増えるぞ…！",           mult:1.9, dur:2400, minStage:2, sfx:sfxRumble, flash:"rgba(120,200,255,0.22)"},
];
const DANGER_RATIO = 0.78;
const ENEMY_START_STAGE = 2; // コンベア2本ステージから出現開始
// 出現間隔(既存のステージ難度カーブを維持)
const ENEMY_CONFIG = [
  null, null,
  {intervalMin:3.2, intervalMax:4.4},
  {intervalMin:2.8, intervalMax:3.8},
  {intervalMin:2.4, intervalMax:3.4},
  {intervalMin:2.0, intervalMax:3.0},
];
function enemyConfig(){ return ENEMY_CONFIG[Math.min(state.stageIndex, ENEMY_CONFIG.length-1)] || ENEMY_CONFIG[ENEMY_START_STAGE]; }

// 敵タイプ: 見た目だけで強さが分かるよう、耐久・ダメージ・速度・サイズを明確に差別化
const ENEMY_TYPES = {
  small:  { hp:1, dmg:15, travel:1.55, r:15, boost:0.08, label:'小型' },
  medium: { hp:2, dmg:25, travel:2.2,  r:21, boost:0.15, label:'中型' },
  large:  { hp:4, dmg:40, travel:3.3,  r:30, boost:0.30, label:'大型' },
};
// ステージが進むほど中型・大型が解禁され、出現比率も上がる
const ENEMY_WEIGHTS = [
  null, null,
  {small:1,    medium:0,    large:0},    // stage2: 小型のみ
  {small:0.6,  medium:0.4,  large:0},    // stage3: 小型+中型
  {small:0.45, medium:0.35, large:0.20}, // stage4: 3種類解禁
  {small:0.35, medium:0.35, large:0.30}, // stage5: 3種類、大型も頻出
];
function pickEnemyType(){
  const w = ENEMY_WEIGHTS[Math.min(state.stageIndex, ENEMY_WEIGHTS.length-1)] || ENEMY_WEIGHTS[ENEMY_START_STAGE];
  const r = Math.random();
  if(r < w.small) return 'small';
  if(r < w.small+w.medium) return 'medium';
  return 'large';
}

/* ---------- ゲーム状態 ---------- */
const state = {
  stageIndex:0, shipsDone:0, totalShipped:0, queue:0,
  phase:'play', // 'play' | 'climax' | 'success' | 'failure'
  activeEvent:null, eventUntil:0, nextEventAt:performance.now()+rand(5000,8000),
  bannerUntil:0,
  mascots:[], particles:[],
  cam:{shake:0, shakeUntil:0, zoom:1, zoomTarget:1, panX:0, panXTarget:0},
  danger:false, nextBeepAt:0,
  climaxT:0, climaxStart:0, climaxFlags:{spike:false,fever:false,ship:false,success:false,ended:false},
  flash:{color:null, until:0, from:0},
  hp:100, enemies:[], lasers:[], nextEnemyAt:performance.now()+rand(4000,6500),
  lines:[], defenseBoostMult:1, defenseBoostUntil:0, session:0,
};
function rand(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
const COLORS = ["#ff8b6b","#ffd23f","#7fd8c0","#8fb6ff","#ff9fd0","#c4e26a"];

function stage(){ return STAGES[Math.min(state.stageIndex, STAGES.length-1)]; }
function currentFillRate(){
  const base = stage().fillRate;
  const mult = (state.activeEvent && state.activeEvent.kind==='rate' && performance.now()<state.eventUntil) ? state.activeEvent.mult : 1;
  const defenseMult = performance.now()<state.defenseBoostUntil ? state.defenseBoostMult : 1;
  return base*mult*defenseMult;
}
function cycleDurFor(stageIndex){
  return Math.max(0.32, 0.6 - stageIndex*0.05);
}
function ensureLines(){
  const s = stage();
  while(state.lines.length < s.lines){
    state.lines.push({progress: rand(0,1), press:0});
  }
  if(state.lines.length > s.lines) state.lines.length = s.lines;
}

/* ---------- カメラ/バナー/フラッシュ演出ヘルパー ---------- */
function shake(amount, ms){ state.cam.shake=amount; state.cam.shakeUntil=performance.now()+ms; }
function zoomTo(z){ state.cam.zoomTarget=z; }
function panTo(x){ state.cam.panXTarget=x; }
function showBanner(main, sub, ms){
  const el = document.getElementById('banner');
  document.getElementById('bannerMain').textContent = main;
  document.getElementById('bannerSub').textContent = sub||'';
  el.classList.add('show');
  state.bannerUntil = performance.now()+(ms||1900);
}
function updateBanner(){
  if(performance.now()>state.bannerUntil) document.getElementById('banner').classList.remove('show');
}
function floatText(txt){
  const wrap = document.getElementById('floaters');
  const d = document.createElement('div');
  d.className='floater'; d.textContent = txt;
  d.style.left = rand(55,78)+'%'; d.style.top = '58%';

/* ---------- 装飾用マスコット(コンベア上を流れる、演出専用) ---------- */
function factoryRect(){
  const s = stage();
  const fw = W*s.fw, fh = H*s.fh;
  return {x:W*0.06, y:H*0.5-fh/2, w:fw, h:fh};
}
function truckRect(){
  const s = stage();
  const size = 34 + s.trucks*4;
  return {x:W*0.86, y:H*0.62, size};
}
function updateMascots(dt){
  const t = truckRect();
  for(let i=state.mascots.length-1;i>=0;i--){
    const m = state.mascots[i];
    m.x += m.vx*dt; m.bob += dt*6;
    if(m.x > t.x-40){ state.mascots.splice(i,1); }
  }
  if(state.mascots.length>90) state.mascots.splice(0, state.mascots.length-90);
}
function lineMachinePos(lineIdx){
  const f = factoryRect(); const s = stage();
  const laneH = f.h/(s.lines+1);
  return {x:f.x+f.w*0.38, y:f.y+laneH*(lineIdx+1)};
}
function spawnMascotFrom(pos){
  state.mascots.push({ x:pos.x, y:pos.y+rand(-3,3), vx:rand(70,100)+state.stageIndex*8, size:rand(9,13), color:pick(COLORS), bob:rand(0,Math.PI*2) });
}
function triggerLineCycle(idx, dur){
  const s = stage();
  const rateEach = currentFillRate()/Math.max(1,s.lines);
  const batch = Math.max(1, Math.round(rateEach*dur));
  const pos = lineMachinePos(idx);
  state.lines[idx].press = 1;
  const big = !!(s.press && idx===0);
  spawnSparks(pos.x, pos.y, big?10:5);
  spawnSmoke(pos.x, pos.y-6, big?4:2);
  sfxGasshan(big);
  if(big) shake(4,150);
  const mySession = state.session;
  for(let i=0;i<batch;i++){
    setTimeout(()=>{ if(state.phase==='play' && state.session===mySession) spawnMascotFrom(pos); }, i*22);
  }
  sfxComplete(batch);
}
function updateProduction(dt, now){
  ensureLines();
  const dur = cycleDurFor(state.stageIndex);
  state.lines.forEach((line, idx)=>{
    line.progress += dt/dur;
    line.press = Math.max(0, line.press - dt*3.2);
    if(line.progress>=1){
      line.progress -= 1;
      triggerLineCycle(idx, dur);
    }
  });
}
function drawMascotLOD(m, i, total){
  // 大量発生時は縮小スプライト(奥側)と通常スプライト(手前)を混ぜて負荷を抑える。
  // 丸のプレースホルダーにはせず、必ず実際のだだんだん画像を使う。
  if(total>50 && (i%3!==0)){
    const yy = m.y + Math.sin(m.bob)*3;
    drawDandanSprite(m.x, yy, m.size*0.65, m.color, false);
  } else {
    drawMascot(m);
  }
}
function drawMascot(m){
  const yy = m.y + Math.sin(m.bob)*3;
  drawDandanSprite(m.x, yy, m.size, m.color);
}

/* ---------- 在庫パイル(ゲージの実数を見える化) ---------- */
function drawQueuePile(){
  const s = stage();
  const t = truckRect();
  const cap = s.capacity;
  const count = Math.min(64, Math.round((state.queue/cap)*64));
  const cols = 10;
  const cellW = 10, cellH = 10;
  const baseX = t.x - 108, baseY = t.y - 6;
  for(let i=0;i<count;i++){
    const col = i%cols, row = Math.floor(i/cols);
    const x = baseX - col*cellW;
    const y = baseY - row*cellH;
    const color = pileColors[i % pileColors.length];
    const size = (count>30 && i>=24) ? 3.6 : 6.5;
    drawDandanSprite(x, y, size, color, size>=6.5);
  }
}
const pileColors = COLORS;

/* ---------- タップ用パーティクル ---------- */
function spawnShipBurst(){
  const t = truckRect();
  for(let i=0;i<9;i++){
    const ang = (Math.PI*2/9)*i + rand(-0.2,0.2);
    state.particles.push({ x:t.x-40, y:t.y-20, vx:Math.cos(ang)*rand(70,150), vy:Math.sin(ang)*rand(70,150)-40, life:1, color: pick(COLORS), size: rand(2,4) });
  }
}
function updateParticles(dt){
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.type==='smoke'){ p.vy -= 30*dt; p.size += dt*22; p.life -= dt*0.9; }
    else { p.vy += 220*dt; p.life -= dt*1.6; }
    if(p.life<=0) state.particles.splice(i,1);
  }
}
function drawParticles(){
  state.particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha = Math.max(0,p.life)*(p.type==='smoke'?0.35:1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}
function spawnSparks(x,y,n){
  for(let i=0;i<n;i++){
    const ang = rand(0,Math.PI*2);
    state.particles.push({x,y,vx:Math.cos(ang)*rand(60,160),vy:Math.sin(ang)*rand(60,160)-60,life:1,color:pick(['#fff2a8','#ffd23f','#fff']),size:rand(1.5,3),type:'spark'});
  }
}
function spawnSmoke(x,y,n){
  for(let i=0;i<n;i++){
    state.particles.push({x:x+rand(-6,6),y:y+rand(-4,4),vx:rand(-8,8),vy:rand(-18,-8),life:1,color:'#cfd6dc',size:rand(4,7),type:'smoke'});
  }
}

/* ---------- 迎撃システム: 敵出現・移動・タップ撃破・着弾ダメージ ---------- */
function turretPos(){ return {x:W*0.5, y:H*0.94}; }
function impactPoint(){
  const f = factoryRect();
  return {x:f.x+f.w*0.5, y:f.y+f.h*0.32};
}
function spawnEnemy(){
  const type = pickEnemyType();
  const def = ENEMY_TYPES[type];
  const imp = impactPoint();
  const x0 = rand(W*0.18, W*0.82);
  state.enemies.push({
    type, x:x0, y:-24, x0, y0:-24,
    tx:imp.x + rand(-18,18), ty:imp.y,
    t:0, dur:def.travel, dmg:def.dmg, r:def.r,
    hp:def.hp, maxHp:def.hp,
  });
}
function updateEnemies(dt, now){
  if(state.stageIndex < ENEMY_START_STAGE) return;
  const cfg = enemyConfig();
  if(now >= state.nextEnemyAt){
    spawnEnemy();
    state.nextEnemyAt = now + rand(cfg.intervalMin, cfg.intervalMax)*1000;
  }
  for(let i=state.enemies.length-1;i>=0;i--){
    const e = state.enemies[i];
    e.t += dt;
    const p = Math.min(1, e.t/e.dur);
    e.x = e.x0 + (e.tx-e.x0)*p;
    e.y = e.y0 + (e.ty-e.y0)*p;
    if(p>=1){
      state.enemies.splice(i,1);
      damageHP(e.dmg);
      const big = e.type==='large';
      shake(big?9:5, big?400:260);
      big ? sfxBoom() : sfxImpact();
      state.flash.color = big ? 'rgba(255,30,15,0.5)' : 'rgba(255,40,20,0.32)';
      state.flash.until = now+(big?400:260); state.flash.from = now;
    }
  }
}
function drawEnemies(now){
  state.enemies.forEach(e=>{
    const p = e.t/e.dur;
    ctx.save();
    ctx.translate(e.x, e.y + Math.sin(now/140+e.x)*(e.type==='large'?1:2.2));
    // 着弾までの警告リング(近づくほど赤く縮む)
    ctx.strokeStyle = `rgba(255,${Math.round(90-70*p)},60,${0.5+0.4*p})`;
    ctx.lineWidth = e.type==='large' ? 3 : 2;
    ctx.beginPath(); ctx.arc(0,0, e.r+6-4*p, 0, Math.PI*2); ctx.stroke();
    drawEnemySprite(e.type, 0, 0, e.r, now);
    // 耐久が2以上残っている(まだ倒しきれていない)ことを示す小さなHPドット
    if(e.maxHp>1){
      for(let k=0;k<e.maxHp;k++){
        ctx.fillStyle = k<e.hp ? '#fff' : 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.arc(-((e.maxHp-1)*5)/2+k*5, -e.r-9, 2.2, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  });
}
function drawLasers(now){
  for(let i=state.lasers.length-1;i>=0;i--){
    const l = state.lasers[i];
    if(now>l.until){ state.lasers.splice(i,1); continue; }
    const a = (l.until-now)/l.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0,a);
    ctx.strokeStyle='#7fffe0'; ctx.lineWidth=3; ctx.shadowColor='#7fffe0'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.stroke();
    ctx.restore();
  }
}
function damageHP(amount){
  state.hp = Math.max(0, state.hp - amount);
  updateHPUI();
  if(state.hp<=0) triggerHPFailure();
}
function updateHPUI(){
  document.getElementById('hpBar').style.width = state.hp+'%';
  document.getElementById('hpText').textContent = Math.round(state.hp);
  const bar = document.getElementById('hpBar');
  const track = document.getElementById('hpTrack');
  if(state.hp<=30){ bar.style.background='var(--danger)'; track.classList.add('hpLow'); }
  else if(state.hp<=60){ bar.style.background='var(--warn)'; track.classList.remove('hpLow'); }
  else { bar.style.background='#5fd0a8'; track.classList.remove('hpLow'); }
}
function triggerHPFailure(){
  if(state.phase!=='play') return;
  state.phase='failure';
  document.getElementById('shipBtn').disabled = true;
  showBanner('⚡ 工場、機能停止…','防衛に失敗した…','2200');
  shake(9,700); zoomTo(0.88); sfxBoom();
  state.flash.color='rgba(255,40,20,0.5)'; state.flash.until=performance.now()+700; state.flash.from=performance.now();
  setTimeout(()=>{
    zoomTo(1);
    document.getElementById('endTitle').textContent = '⚡ 工場、機能停止…';
    document.getElementById('endTitle').style.color = 'var(--danger)';
    document.getElementById('endStats').innerHTML = '到達 Lv.'+(state.stageIndex+1)+' '+stage().name+'<br>総出荷 '+state.totalShipped+' 体';
    document.getElementById('endPanel').classList.add('show');
    document.getElementById('replayBtn').classList.add('show');
  }, 1500);
}
function screenToGame(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const sxScreen = clientX - rect.left, syScreen = clientY - rect.top;
  const cam = state.cam;
  return {
    x: (sxScreen - W/2 - cam.panX)/cam.zoom + W/2,
    y: (syScreen - H/2)/cam.zoom + H/2,
  };
}
function tryIntercept(clientX, clientY){
  if(state.phase!=='play') return;
  const p = screenToGame(clientX, clientY);
  let best=-1, bestD=9999;
  state.enemies.forEach((e,i)=>{
    const d = Math.hypot(e.x-p.x, e.y-p.y);
    if(d < e.r+16 && d < bestD){ bestD=d; best=i; }
  });
  if(best>=0){
    const e = state.enemies[best];
    ensureAudio();
    const turret = turretPos();
    state.lasers.push({x1:turret.x, y1:turret.y, x2:e.x, y2:e.y, life:130, until:performance.now()+130});
    e.hp -= 1;
    if(e.hp > 0){
      // まだ倒しきれていない: 小さめのヒット演出だけ
      for(let i=0;i<3;i++){
        const ang = rand(0,Math.PI*2);
        state.particles.push({x:e.x, y:e.y, vx:Math.cos(ang)*rand(30,70), vy:Math.sin(ang)*rand(30,70), life:1, color:'#7fffe0', size:rand(1.5,2.5)});
      }
      sfxLaser();
      return;
    }
    // 撃破: タイプが大きいほど派手な演出("ドカーン")にする
    const def = ENEMY_TYPES[e.type];
    const big = e.type==='large', mid = e.type==='medium';
    const burstN = big?18:(mid?11:6);
    for(let i=0;i<burstN;i++){
      const ang = rand(0,Math.PI*2);
      state.particles.push({x:e.x, y:e.y, vx:Math.cos(ang)*rand(50,big?220:130), vy:Math.sin(ang)*rand(50,big?220:130), life:1, color: big?pick(['#ffb020','#ff5a3c','#fff']):'#7fffe0', size:rand(big?3:2,big?6:3)});
    }
    if(big){ spawnSmoke(e.x, e.y, 5); shake(6,220); }
    if(big) sfxBoom(); else if(mid){ sfxLaser(); setTimeout(sfxImpact, 40); } else sfxLaser();
    state.enemies.splice(best,1);
    // 防衛成功 → 生産ブースト(工場側にメリットが返る)。強い敵ほどブーストも大きい
    const now = performance.now();
    const wasBoosted = now < state.defenseBoostUntil;
    state.defenseBoostMult = Math.min(1.9, (wasBoosted ? state.defenseBoostMult : 1) + def.boost);
    state.defenseBoostUntil = now + (big?5500:4000);
    if(!wasBoosted) floatText(big?'撃破!大幅生産UP':'防衛成功!生産UP');
  }
}
canvas.addEventListener('pointerdown', (evt)=>{ tryIntercept(evt.clientX, evt.clientY); });


/* ---------- 在庫ゲージ更新・出荷・オーバーフロー ---------- */
function updateGaugeUI(){
  const s = stage();
  const ratio = Math.min(1, state.queue/s.capacity);
  document.getElementById('gaugeBar').style.width = (ratio*100)+'%';
  document.getElementById('gaugeText').textContent = Math.floor(state.queue)+' / '+s.capacity;
  const track = document.getElementById('gaugeTrack');
  const bar = document.getElementById('gaugeBar');
  if(ratio>=DANGER_RATIO){
    bar.style.background = 'var(--danger)';
    track.classList.add('danger');
    stageEl.classList.add('danger');
  } else if(ratio>=0.5){
    bar.style.background = 'var(--warn)';
    track.classList.remove('danger');
    stageEl.classList.remove('danger');
  } else {
    bar.style.background = 'var(--safe)';
    track.classList.remove('danger');
    stageEl.classList.remove('danger');
  }
  state.danger = ratio>=DANGER_RATIO;
}
function tickQueue(dt, now){
  const s = stage();
  state.queue += currentFillRate()*dt;
  updateMascots(dt);
  updateGaugeUI();
  if(state.danger){
    const ratio = Math.min(1, state.queue/s.capacity);
    const interval = 480 - (ratio-DANGER_RATIO)/(1-DANGER_RATIO)*340; // 480ms→140ms
    if(now>=state.nextBeepAt){ sfxBeep(700+ratio*500); state.nextBeepAt = now+interval; }
  }
  if(state.queue >= s.capacity){ triggerFailure(); }
}
function doShip(){
  if(state.phase!=='play') return;
  ensureAudio();
  const s = stage();
  if(state.queue < 0.5){ floatText('在庫なし'); return; }
  const now = performance.now();
  const bonus = (state.activeEvent && state.activeEvent.kind==='bonus' && now<state.eventUntil) ? state.activeEvent.mult : 1;
  const gained = Math.round(state.queue*bonus);
  state.totalShipped += gained;
  state.queue = 0;
  state.shipsDone++;
  document.getElementById('scoreVal').textContent = state.totalShipped;
  sfxShip(); spawnShipBurst(); shake(3,150); floatText('+'+gained);
  updateGaugeUI();
  if(state.shipsDone >= s.ships){
    advanceStage();
  } else {
    showBanner('🚚 出荷！ +'+gained+'体','',900);
  }
}
document.getElementById('shipBtn').addEventListener('pointerdown', doShip);
document.addEventListener('pointerdown', ensureAudio, {once:true});

/* ---------- ステージ進行 ---------- */
function advanceStage(){
  state.shipsDone = 0;
  if(state.stageIndex < STAGES.length-1){
    state.stageIndex++;
    const s = stage();
    document.getElementById('stageLabel').textContent = 'Lv.'+(state.stageIndex+1)+' '+s.name;
    showBanner(s.banner, s.sub, 2000);
    sfxUpgrade();
    if(s.press && STAGES[state.stageIndex-1].press!==true){
      shake(6,500); zoomTo(0.93); sfxRumble(); setTimeout(sfxThud,550);
      setTimeout(()=>zoomTo(1),700);
    }
    if(state.stageIndex === STAGES.length-1){
      shake(8,600); zoomTo(0.95); sfxFever();
      setTimeout(()=>zoomTo(1),900);
    }
  } else {
    startClimax();
  }
}

/* ---------- ランダムイベント ---------- */
function maybeTriggerEvent(now){
  if(state.phase!=='play') return;
  if(now < state.nextEventAt) return;
  if(now < state.bannerUntil){ state.nextEventAt = now+1000; return; }
  const eligible = RANDOM_EVENTS.filter(e=>state.stageIndex>=e.minStage);
  if(eligible.length===0){ state.nextEventAt = now+2000; return; }
  const ev = pick(eligible);
  state.activeEvent = ev; state.eventUntil = now+ev.dur;
  showBanner(ev.banner, ev.sub, ev.dur-200);
  if(ev.sfx) ev.sfx();
  shake(3,220);
  state.flash.color = ev.flash; state.flash.until = now+400; state.flash.from = now;
  state.nextEventAt = now + rand(6000,9500);
}

/* ---------- クライマックス ---------- */
let climaxGrid = [];
function startClimax(){
  state.phase='climax';
  document.getElementById('shipBtn').disabled = true;
  document.getElementById('stageLabel').textContent = '工場、限界突破！';
  showBanner('🚨 工場、限界突破！！','',1600);
  state.climaxStart = performance.now();
  state.climaxFlags = {spike:false, fever:false, ship:false, success:false, ended:false};
  shake(7,500); zoomTo(0.9); sfxRumble();
  climaxGrid = [];
  const cols=12, rows=8;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      climaxGrid.push({ x:(c+0.5)/cols, y:(r+0.5)/rows, color:pick(COLORS), size:rand(9,14), revealAt: 900+(r*cols+c)*14+rand(0,30) });
    }
  }
}
function updateClimax(now){
  const t = now - state.climaxStart;
  state.climaxT = t;
  const f = state.climaxFlags;
  if(!f.spike && t>=900){
    f.spike=true; showBanner('⚡ さらに生産速度UP！','',1200); sfxUpgrade(); shake(4,300);
  }
  if(!f.fever && t>=2300){
    f.fever=true; showBanner('🔥 超大量生産 🔥','画面いっぱいのだだんだん',2000); sfxFever(); zoomTo(1); shake(5,350);
  }
  if(!f.ship && t>=6300){
    f.ship=true; showBanner('🚚🚚 一斉出荷！！','',2400); sfxHorn(); zoomTo(0.92); panTo(-14);
  }
  if(!f.success && t>=9200){
    f.success=true; showBanner('🎉 大成功！！','累計出荷 '+state.totalShipped+' 体',3000); zoomTo(1); panTo(0);
  }
  if(!f.ended && t>=12500){
    f.ended=true; endClimax();
  }
}
function endClimax(){
  state.phase='success';
  document.getElementById('endTitle').textContent = '🎉 大成功！！';
  document.getElementById('endTitle').style.color = 'var(--gold)';
  document.getElementById('endStats').innerHTML = '全ステージクリア！<br>総出荷 '+state.totalShipped+' 体';
  document.getElementById('endPanel').classList.add('show');
  document.getElementById('replayBtn').classList.add('show');
}
function drawClimax(now){
  const t = state.climaxT;
  drawSky();
  const f = factoryRect();
  ctx.fillStyle='#2c343c';
  ctx.fillRect(f.x, f.y*0.4, f.w*1.15, f.h*1.5);
  const departPhase = t>=6300;
  const shift = departPhase ? Math.min(1,(t-6300)/2600)*W*0.5 : 0;
  let revealedCount = 0;
  climaxGrid.forEach(cell=>{ if(t>=cell.revealAt) revealedCount++; });
  let shown = 0;
  climaxGrid.forEach(cell=>{
    if(t < cell.revealAt) return;
    const cx = cell.x*W + shift;
    const cy = cell.y*H*0.86 + H*0.05;
    if(cx > W+20) return;
    shown++;
    // 手前(先に出現した約7割)はフルサイズのスプライト、奥は縮小スプライト(丸のプレースホルダーは使わない)
    if(shown <= 72){
      drawDandanSprite(cx, cy, cell.size, cell.color);
    } else {
      drawDandanSprite(cx, cy, cell.size*0.55, cell.color, false);
    }
  });
  ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🚚', W*0.9+(departPhase?shift:0), H*0.9);
  ctx.fillText('🚚', W*0.78+(departPhase?shift:0), H*0.9);
}

/* ---------- リセット ---------- */
function resetGame(){
  state.stageIndex=0; state.shipsDone=0; state.totalShipped=0; state.queue=0;
  state.phase='play'; state.mascots=[]; state.particles=[];
  state.activeEvent=null; state.eventUntil=0; state.cam={shake:0,shakeUntil:0,zoom:1,zoomTarget:1,panX:0,panXTarget:0};
  state.danger=false; state.nextBeepAt=0; state.flash={color:null,until:0,from:0};
  state.nextEventAt = performance.now()+rand(5000,8000);
  state.hp=100; state.enemies=[]; state.lasers=[]; state.nextEnemyAt=performance.now()+rand(4000,6500);
  state.lines=[]; state.defenseBoostMult=1; state.defenseBoostUntil=0;
  state.climaxT=0; state.climaxStart=0; state.climaxFlags={spike:false,fever:false,ship:false,success:false,ended:false};
  state.session += 1; // 前回ゲームのsetTimeoutが残っていても無効化する
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('stageLabel').textContent='Lv.1 '+STAGES[0].name;
  document.getElementById('shipBtn').disabled=false;
  document.getElementById('endPanel').classList.remove('show');
  document.getElementById('replayBtn').classList.remove('show');
  stageEl.classList.remove('danger');
  document.getElementById('gaugeTrack').classList.remove('danger');
  document.getElementById('hpTrack').classList.remove('hpLow');
  ensureLines();
  updateGaugeUI(); updateHPUI();
  showBanner('操業開始！','だだんだん製造、はじまる',1800);
}
document.getElementById('replayBtn').addEventListener('click', resetGame);

/* ---------- 描画: 背景・工場 ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--bg-sky-top'));
  g.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--bg-sky-bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,H*0.72,W,H*0.28);
}
function drawFactory(now){
  const s = stage();
  const f = factoryRect();
  ctx.fillStyle='#2c343c'; ctx.fillRect(f.x, f.y, f.w, f.h);
  ctx.fillStyle='#39424d'; ctx.fillRect(f.x, f.y, f.w, f.h*0.18);
  ctx.fillStyle='#f2a93b';
  for(let i=0;i<3;i++) ctx.fillRect(f.x+f.w*0.12+i*f.w*0.28, f.y+f.h*0.32, f.w*0.14, f.h*0.14);

  ensureLines();
  const dur = cycleDurFor(state.stageIndex);
  const laneH = f.h/(s.lines+1);
  const dashSpeed = state.danger ? 2.2 : 1;

  // 大型プレス機(実際の製造サイクルに同期してスラム)
  if(s.press){
    const line0 = state.lines[0] || {press:0};
    const px = f.x+f.w*0.72, py = Math.max(f.y-f.h*0.22, 10);
    const idleBob = Math.sin(now/260)*0.02;
    const slam = line0.press*0.16;
    ctx.save(); ctx.translate(px, py+slam*f.h*0.3); ctx.scale(1+idleBob, 1+idleBob-slam);
    ctx.fillStyle='#586471'; ctx.fillRect(-f.w*0.11, 0, f.w*0.22, f.h*0.5);
    ctx.fillStyle='#242b32'; ctx.fillRect(-f.w*0.14, -8, f.w*0.28, 10);
    ctx.restore();
  }

  // コンベア
  ctx.strokeStyle='#ffcc33'; ctx.lineWidth=2;
  for(let i=0;i<s.lines;i++){
    const y = f.y+laneH*(i+1);
    ctx.setLineDash([10,8]); ctx.lineDashOffset = -((now*dashSpeed)/28 % 18);
    ctx.beginPath(); ctx.moveTo(f.x+f.w*0.55, y); ctx.lineTo(truckRect().x, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 各製造ライン: 材料スライド→プレス(スクワッシュ)を可視化
  for(let i=0;i<s.lines;i++){
    const line = state.lines[i];
    const pos = lineMachinePos(i);
    const p = line ? line.progress : 0;
    const pressAmt = line ? line.press : 0;
    if(p < 0.4){
      const mx = pos.x - f.w*0.16 + (p/0.4)*f.w*0.1;
      ctx.fillStyle = '#c9c2b2';
      ctx.fillRect(mx-4, pos.y-4, 8, 8);
    }
    ctx.save();
    ctx.translate(pos.x, pos.y);
    const squish = 1 - pressAmt*0.35;
    ctx.scale(1+pressAmt*0.15, squish);
    ctx.fillStyle = '#8b96a3';
    ctx.fillRect(-11, -9, 22, 18);
    ctx.fillStyle = '#5a6472';
    ctx.fillRect(-11, -9, 22, 5);
    ctx.restore();
  }

  // 装飾用の背景ロボット(見た目の賑やかさ担当、生産数には影響しない)
  ctx.font = (13+state.stageIndex)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=s.lines;i<s.robots;i++){
    const rx = f.x + f.w*(0.2 + (i%3)*0.18);
    const ry = f.y + f.h*(0.72 + Math.floor(i/3)*0.14);
    ctx.fillText('🤖', rx, ry + Math.sin(now/220+i)*2);
  }
}
function drawTrucks(){
  const t = truckRect(); const s = stage();
  ctx.font = t.size+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<s.trucks;i++) ctx.fillText('🚚', t.x+i*t.size*0.9, t.y - i*4);
}
function drawTurret(now){
  if(state.stageIndex < ENEMY_START_STAGE) return;
  const p = turretPos();
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = '#556170';
  ctx.fillRect(-14, -4, 28, 8);
  ctx.fillStyle = '#7fffe0';
  const aimAngle = -Math.PI/2 + Math.sin(now/500)*0.15;
  ctx.strokeStyle = '#7fffe0'; ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-2);
  ctx.lineTo(Math.cos(aimAngle)*16, -2+Math.sin(aimAngle)*16);
  ctx.stroke();
  ctx.restore();
}

/* ---------- メインループ ---------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;

  if(state.phase==='play'){
    tickQueue(dt, now);
    maybeTriggerEvent(now);
    updateEnemies(dt, now);
    updateProduction(dt, now);
  } else if(state.phase==='climax'){
    updateClimax(now);
  }
  updateParticles(dt);
  updateBanner();

  const cam = state.cam;
  cam.zoom += (cam.zoomTarget-cam.zoom)*0.08;
  cam.panX += (cam.panXTarget-cam.panX)*0.08;
  let sx=0, sy=0;
  if(now < cam.shakeUntil){ sx = rand(-cam.shake,cam.shake); sy = rand(-cam.shake,cam.shake); }

  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(W/2+sx+cam.panX, H/2+sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-W/2, -H/2);

  if(state.phase==='climax'){
    drawClimax(now);
  } else {
    drawSky();
    drawFactory(now);
    state.mascots.forEach((m,i,arr)=>drawMascotLOD(m,i,arr.length));
    drawQueuePile();
    drawParticles();
    drawTrucks();
    drawTurret(now);
    drawEnemies(now);
    drawLasers(now);
  }
  ctx.restore();

  if(state.flash.color && now<state.flash.until){
    const remain = (state.flash.until-now)/(state.flash.until-state.flash.from);
    ctx.save(); ctx.globalAlpha = Math.max(0,remain); ctx.fillStyle = state.flash.color; ctx.fillRect(0,0,W,H); ctx.restore();
  }

  requestAnimationFrame(frame);
}

resize();
updateGaugeUI();
updateHPUI();
showBanner('操業開始！','だだんだん製造、はじまる',1800);
requestAnimationFrame(frame);
})();
</script>
