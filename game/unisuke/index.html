field.addEventListener("touchstart", touchStartFieldFirst, {passive:false});

    var width_cnt = [];
for (xnum = 0; xnum < GROUND_XSECNUM; xnum++) {
width_cnt[xnum] = [];
        for (ynum = 0; ynum < GROUND_YSECNUM; ynum++) {
            if (ynum % 2 == 0) {
                width_cnt[xnum][ynum] = xnum * BLOCK_WH;

                width_cnt[xnum][ynum] = xnum * BLOCK_WH + GROUND_WH*2;

        cur_bgcolor = bgcolor_keep;

        can.fillStyle = cur_bgcolor;

    let acc = 9.8*0.04;//加速度
    
    function g_calc (t_dy, t_t, t_v0) {
        ret = t_dy + t_v0 * t_t + 0.5 * acc * t_t * t_t;
        return ret;
    }

    function startSpdInit() {
        total_cnt = 0;
        cur_speed = CUR_INIT_SPEED;
    }

    function getTotalCnt() {
        return total_cnt;
    }

    function chgspdtask() {
      
      if (return_cnt != -1) {
        if ((spd_cnt>200)
            && (!getStageEnd())){
            cur_speed += 0.07;
            spd_cnt=0;
            total_cnt++;
        }
        spd_cnt++;
      }

        if (return_cnt == -1) {
        }
        else if (return_cnt > 0) {
            return_cnt--;
        } else {
            if (cur_speed_keep != -1){
              cur_speed = cur_speed_keep;
              cur_speed_keep = -1;
              reset_bg_color();
            }
        }
      
      
    }

    function get_move_ok() {
        if ( cur_speed == 0 ){
            return false;
        } else {
            return true;
        }
    }

    function get_move_spd() {
        return cur_speed;
    }

    function init_move_spd(t_k) {
        cur_speed = cur_speed*t_k;
        spd_cnt=0;
        return_cnt = 0;
        cur_speed_keep = -1;
    }

    function set_move_ng() {
        cur_speed = 0;
    }

    function set_move_slow() {
        cur_speed = 0.2;
    }

    function stop_move(t_cnt, bgcolor) {
        cur_speed_keep = cur_speed;
        cur_speed = 0;
        return_cnt = t_cnt;

        set_bg_color(bgcolor);
        
    }
    
    function stop_move_cnt() {
        cur_speed_keep = cur_speed;
        cur_speed = 0;
        return_cnt = -1;
    }

    function restart_move_cnt() {
        cur_speed = cur_speed_keep;
        cur_speed_keep = -1;
    }
    
    
    function chg_move_spd() {
        cur_speed += (0.2/cur_speed);
    }

    //#############################
    //スコア系
    //#############################
    let chg_score_ary = [];
    let score_x_ofs = 0;

    function chg_score(chg_val,x,y) {
        if ((getStageEnd() == false)
          && (get_move_ok())) {
          t_lv = get_level();
          t_upscore = (chg_val * t_lv);
          score += (chg_val * t_lv);
          sc.textContent = "SCORE: " + score;
          if (score_x_ofs == 0) {
            score_x_ofs = 20;
          } else if (score_x_ofs == 20) {
            score_x_ofs = 40;
          } else {
            score_x_ofs = 0;
          }
     
          chg_score_ary.push([t_upscore,
                            0,
                          x + score_x_ofs,
                            y]);
        }
    }

        can.fillStyle = 'red';

    function scoreTask() {
        for (i = 0; i < chg_score_ary.length; i++) {
            val = chg_score_ary[i][0];
            if (val > 0) {
                val = "+" + val;
            }
            cnt = chg_score_ary[i][1];
            x = chg_score_ary[i][2];
            y = chg_score_ary[i][3];
            if (cnt < 40) {
                can.font = '20pt Arial';
                can.fillStyle = 'brown';
                can.fillText(val,       
                             x, 
                             y - cnt);

                cnt++;
                chg_score_ary[i][1] = cnt;
            } else {
               chg_score_ary.splice(i,1);
            }
            
        }
    }

    class clMainChara {
        constructor( t_img_src, 
                     t_sp_src,

            this.sp_m = t_sp_m;

            this.avd = t_avd;

            this.stsold = this.sts;
            this.justhis = false;

            this.level = 1;

            this.startx = CHARA_BASE_X;
            this.starty = CHARA_BASE_Y;

            this.justsy = 0;
            this.jecnt = 0;

        get mySpImg() {

        }
        get myExpImg() {
            return this.exp_img;
        }
        get myV0_k() {
            return this.v0_k;
        }
        get mySp_m() {
            return this.sp_m;
        }
        get myLife() {
            return this.life;
        }
        get myAvd() {
            return this.avd;
        }
        get myCrt() {
            return this.crt;
        }

        get myDispW() {
            return this.dispw;
        }
        get myDispH() {
            return this.disph;
        }
        get myDispX() {
            return this.dispx;
        }
        get myDispY() {
            return this.dispy;
        }
        get myDispCenX() {
            return this.dispx+this.dispw/2;
        }
        get myDispCenY() {
            return this.dispy+this.disph/2;
        }
        get mySts() {
            return this.sts;
        }
        get myStsOld() {
            return this.stsold;
        }

        get myDispExpW() {
            return this.exp_img.naturalWidth;
        }
        get myDispExpH() {
            return this.exp_img.naturalHeight;
        }
        get myJustHis() {
            return this.justhis;

        get myJustOk() {

        get myJustSX() {
            return this.justsx;
        }
        get myJustSY() {
            return this.justsy;
        }
        get myLevel() {
            return this.level;
        }
        get myStartX() {
            return this.startx;
        }
        get myStartY() {
            return this.starty;
        }
        get myJEndCnt() {
            return this.jecnt;
        }

        


        //セット
        set myDispX(value) {
            this.dispx = value;
        }
        set myDispY(value) {
            this.dispy = value;
        }
        set myDispW(value) {
            this.dispw = value;
        }
        set myDispH(value) {
            this.disph = value;
        }
        set mySts(value) {
            this.sts = value;
        }
        set myStsOld(value) {
            this.stsold = value;
        }
        set myJustHis(value) {
            this.justhis = value;
        }
        set myJustOk(value) {
            this.justok = value;
        }
        set myJustSX(value) {
            this.justsx = value;
        }
        set myJustSY(value) {
            this.justsy = value;
        }
        set myLevel(value) {
            this.level = value;
        }
        set myJEndCnt(value) {
            this.jecnt = value;
        }
    }

    function MainCharaSelect(){

        can.fillStyle = "#ffffff";

    function pushSelMainChara(tap) {
         
        t_x = SEL_LEFTX;
        t_y = SEL_Y;
        t_w = SEL_WH;
        t_h = SEL_WH*2;
        tapx = tap[0];
        tapy = tap[1];

        if (((t_x < tapx) 
           &&(tapx < (t_x+t_w)))
         && ((t_y < tapy) 
           &&(tapy < (t_y+t_h))))
        {
            chara_sel --;
            if (chara_sel < 0){
                chara_sel =MC_NUM-1;
            }
            drawSelectChara(chara_sel);
        }

        t_x = SEL_RIGHTX;
        t_y = SEL_Y;
        t_w = SEL_WH;
        t_h = SEL_WH*2;
        tapx = tap[0];
        tapy = tap[1];

        if (((t_x < tapx) 
           &&(tapx < (t_x+t_w)))
         && ((t_y < tapy) 
           &&(tapy < (t_y+t_h))))
        {
            chara_sel ++;
            if (chara_sel >= MC_NUM){
                chara_sel =0;
            }
            drawSelectChara(chara_sel);
            
        }
         
    }

function drawSelectChara(idx) {

}

        cls_Mc.mySts = JUMP_END;
        draw_k = 1;
        angle = 0;
        end_count = 0;
        mainchara_cnt = 0;
        invdraw_cnt = 0;
        invdush_sts = 0;
        mc_clear_cnt=0;
        mc_clear_ofs=0;

        mc_jp_v0 = JUMP_V0 *cls_Mc.myV0_k;
    }

function drawMainChara() {
    if (cls_Mc.mySts == JUMP_START) {
        jump_ofs_base = jump_cnt = 40;
        cls_Mc.mySts = JUMP_ING;
        jump_t = 0;
    }
    dx_confirm = CHARA_BASE_X;
    dy_confirm = CHARA_BASE_Y;
    w_confirm = cls_Mc.myDispW;
    h_confirm = cls_Mc.myDispH;

    if (cls_Mc.mySts == GAME_CLEAR) {
        if (mc_clear_ofs == 0) {
            jump_t = 0;
        }
        dx_confirm += mc_clear_ofs;
        draw_cnt += 2;

        if (draw_cnt > 40) {
            draw_cnt = 0;
            dush_sts = 1 - dush_sts; // 0と1を切り替える
        }

        if (dush_sts == 1) {
            dy_confirm -= BLOCK_WH / 10;
        }

        if (dx_confirm > GAME_WIDTH / 2 - w_confirm / 2) {
            jump_t++;
            dy_confirm = g_calc(dy_confirm, jump_t, CLEAR_JUMP_V0);
            if (dy_confirm >= CHARA_BASE_Y) {
                dy_confirm = CHARA_BASE_Y;
                mc_clear_cnt++;
                jump_t = 0;
                if (mc_clear_cnt >= 2) {
                    setClearEndOk();
                }
            }
        } else {
            mc_clear_ofs += 2;
        }

    } else if (cls_Mc.mySts == CRASH) {
        // 衝突後
        if (cls_Mc.myDispW > cls_Mc.myImg.naturalWidth / 10 * (3.5 + crash_size_ofs)) {
            end_count++;
            set_move_ng();
            if (end_count > 100) {
                game_over();
            }
        } else {
            draw_k = 1.02;
            w_confirm *= draw_k;
            h_confirm *= draw_k;

            movex_cen = cls_Mc.myDispCenX + crash_af_dx / 2;
            movey_cen = cls_Mc.myDispCenY + crash_af_dy / 2;

            angle += 10;
        }
        dx_confirm = movex_cen - w_confirm / 2;
        dy_confirm = movey_cen - h_confirm / 2;

    } else if (cls_Mc.mySts == JUMP_ING) {
        // ジャンプ中
        draw_cnt = 0;

        jump_t += get_move_spd() / 2; // 時間加算

        dy_confirm = g_calc(dy_confirm, jump_t, mc_jp_v0);

        if (dy_confirm >= CHARA_BASE_Y) {
            dy_confirm = CHARA_BASE_Y;

            cls_Mc.myJEndCnt++;

            if (cls_Mc.myJEndCnt > 10) {
                cls_Mc.mySts = JUMP_END; // 終了
                cls_Mc.myJEndCnt = 0;
                plus_exp(1);
            }
        }

        drawBackJust(
            cls_Mc.myDispX + cls_Mc.myDispW,
            cls_Mc.myDispY,
            cls_Mc.myDispW / 2);

    } else {
        draw_cnt += get_move_spd();
        jump_ofs = 0;
        // 上下の動き
        if (draw_cnt > 40) {
            draw_cnt = 0;
            dush_sts = 1 - dush_sts; // 0と1を切り替える
        }

        if (dush_sts == 1) {
            dy_confirm -= BLOCK_WH / 10;
        }
    }

    // 回転処理
    rad = angle * Math.PI / 180;
    can.save(); // 保存して後で復活

    var cx = cls_Mc.myDispCenX;
    var cy = cls_Mc.myDispCenY;

    can.setTransform(Math.cos(rad),
        Math.sin(rad),
        -Math.sin(rad),
        Math.cos(rad),
        cx - cx * Math.cos(rad) + cy * Math.sin(rad),
        cy - cx * Math.sin(rad) - cy * Math.cos(rad));

    t_nodisp = getLifeNoDisp();

    if ((cls_Mc.mySts == CRASH) || (!t_nodisp)) {
        // 描画
        can.drawImage(cls_Mc.myImg, 0, 0,
            cls_Mc.myImg.naturalWidth,
            cls_Mc.myImg.naturalHeight,
            dx_confirm,
            dy_confirm,
            w_confirm,
            h_confirm);
    }

    can.restore(); // 復活

    cls_Mc.myDispX = dx_confirm;
    cls_Mc.myDispY = dy_confirm;
    cls_Mc.myDispW = w_confirm;
    cls_Mc.myDispH = h_confirm;

    // 無敵系
    t_mc_cntold = mainchara_cnt;
    mainchara_cnt -= get_move_spd();
    if (mainchara_cnt <= 0) {
        mainchara_cnt = 0;
        if (t_mc_cntold > 0) {
            setNoMinus();
        }
    } else {
        invdraw_cnt += get_move_spd();

        inv_dx_confirm = CHARA_BASE_X + 40;
        inv_dy_confirm = dy_confirm + 30;
        // 上下の動き
        if (invdraw_cnt > 20) {
            invdraw_cnt = 0;
            invdush_sts = 1 - invdush_sts; // 0と1を切り替える
        }

        if (invdush_sts == 1) {
            inv_dy_confirm -= (BLOCK_WH / 10) * 5;
        }

        if (cls_Mc.mySts != GAME_CLEAR) {
            can.drawImage(inv_img, 0, 0,
                inv_img.naturalWidth,
                inv_img.naturalHeight,
                inv_dx_confirm,
                inv_dy_confirm,
                inv_img.displayWidth,
                inv_img.displayHeight);
            inv_img.display_x = inv_dx_confirm;
            inv_img.display_y = inv_dy_confirm;
        }

    }
    cls_Mc.myStsOld = cls_Mc.mySts;
}


function crash_MainChara(t_enclashcall, t_damage) {
    if (mainchara_cnt <= 0) {
        const t_avoid = Math.random();
        
        if (getAvd() > t_avoid) {
            chgLife(0);
        } else {
            chgLife(-t_damage);
        }

        const t_life = getLife();

        if (t_life <= 0 && cls_Mc.mySts !== CRASH) {
            cls_Mc.mySts = CRASH;
            // 飛んでいく方向
            const ofs = Math.random() * 0.5;
            const radian = (1.5 + ofs) * Math.PI;
            crash_af_dx = Math.cos(radian) * 5;
            crash_af_dy = Math.sin(radian) * 5;
            crash_size_ofs = Math.random() * 4;
        }
    } else {
        if (t_enclashcall) {
            enemyCrash(0.8);
        }
    }
}

    function initStage() {
        stage = START_STAGE;
        clear_end_ok = false;
        updateStage();
        

        for(i=0;i<HANABI_NUM;i++){
          
          hanabic_img[i].displayWidth = hanabic_img[i].naturalWidth/10;
          hanabic_img[i].displayHeight = hanabic_img[i].naturalHeight/10;

          hanabio_img[i].displayWidth = hanabio_img[i].naturalWidth/10;
          hanabio_img[i].displayHeight = hanabio_img[i].naturalHeight/10;

          hanabi_cnt[i]=-i*30;
        }
    }

    function updateStage() {
        stage++;
        //stage=4;
        stg_disp_cnt = 100;
        if (stage == 1) {
            set_bg_color('#67AECB');
            init_move_spd(1);
        } else if (stage == 2) {
            set_bg_color('#E2A872');
            init_move_spd(0.75);
        } else if (stage == 3) {
            set_bg_color('#444E6A');
            init_move_spd(0.75);
        } else if (stage == 4) {
            set_bg_color('#343E5A');
            init_move_spd(0.75);
        } else if (stage == 5) {
          if(get_enc_exist()){
            set_bg_color('#333333');
            init_move_spd(0.75);
          }
        } else {
            //CLEAR時の動作
            set_move_slow();
        }
    }

    function getStage() {
        return stage;
    }

    function getStageEnd() {
        ret = false;
        if (stage > MAX_STAGE) {
            ret = true;
        }
        return ret;
    }

    function setClearEndOk() {
        clear_end_ok = true;
    }

    function stageTask() {
        if (stg_disp_cnt > 0) {
          if (stage < MAX_STAGE) {
            can.font = 'bold italic 24pt Arial';
            can.fillStyle = 'Blue';
            t_str = 'STAGE ' + stage;
            if (MAX_STAGE == stage) {
                t_str = 'LAST STAGE';
            }
            can.fillText(t_str,       
                          STAGE_X, 
                          STAGE_Y);
          }
          stg_disp_cnt--;
          
        } else {
            //クリア時アクション
            if (stage > MAX_STAGE) {
                t_en_nodisp = get_en_nodisp();
                  
              if ((t_en_nodisp)
                 && (cls_Mc.mySts == JUMP_END)){

                cls_Mc.mySts = GAME_CLEAR;
                set_move_ng();
                  
              }
              if (!get_move_ok()){
               for(i=0;i<HANABI_NUM;i++){
                t_disp = false;
                if (hanabi_cnt[i]<0){

                }
                else if (hanabi_cnt[i]<20){
                  t_img = hanabic_img[i];
                  t_disp= true;
                }
                else if (hanabi_cnt[i]<40){
                  t_img = hanabio_img[i];
                  t_disp= true;
                }
                if (t_disp) {
                  can.drawImage(t_img, 
                    0, 0,
                    t_img.naturalWidth, 
                    t_img.naturalHeight,
                    hanabi_posi[i][0], 
                    hanabi_posi[i][1], 
                    t_img.displayWidth,
                    t_img.displayHeight);
                }
                hanabi_cnt[i]++;
               }
              }
            }

            if(clear_end_ok){
                game_clear();
            }
        }
    }

    //ボス1
    var BOSS1_WAITX = 270;

    function Boss1Move(t_xinit){
        dx = cls_EnAry[BOSS1].myDispX;
        sts = cls_EnAry[BOSS1].mySts;
        atk2cnt = cls_EnAry[BOSS1].myCnt1;
        tmpx1 = cls_EnAry[BOSS1].TmpX1;
        if (t_xinit) {
            atk2cnt = 0;
            sts = STS_APPEAR;
        } else {

          if (sts==STS_APPEAR) {
            dx -= get_move_spd()/2;
            if (dx <= BOSS1_WAITX) {
              dx = BOSS1_WAITX;
              sts = STS_WAIT;
            }
          }else if(sts==STS_WAIT){
            t_jdg = Math.random()*1000;
            if(t_jdg < 10) {
              sts = STS_ATK1;
              tmpx1 = dx;
            }
          }else if(sts==STS_ATK1) {
            dx -= get_move_spd();
            t_mx = dx - tmpx1;
            if (t_mx < -80) {
              sts = STS_ATK2;
              atk2cnt = 0;
            }
          }else if(sts==STS_ATK2) {
            atk2cnt++;
            if (dx < 30) {
              sts = STS_RET1;
            }
            else if (atk2cnt > 30) {
              sts = STS_ATK1;
              tmpx1 = dx;
            }
          } else {
            dx += get_move_spd()*3.5;
            if (dx >= BOSS1_WAITX) {
              dx = BOSS1_WAITX;
              sts = STS_WAIT;
            }
          }
        }

        cls_EnAry[BOSS1].myDispX = dx;
        cls_EnAry[BOSS1].mySts = sts;
        cls_EnAry[BOSS1].myCnt1 = atk2cnt;
        cls_EnAry[BOSS1].TmpX1 = tmpx1;
    }

    function enemyTask() {
        t_en_nodisp = get_en_nodisp();
        t_xinit = false;

        if (t_en_nodisp) {
          if (enidx != -1) {
            chg_score(10,
                    cls_Mc.myDispX,
                    cls_Mc.myDispY);
                
          }
          
          en_cnt++;
          boss_sel = 0;
          t_stage = getStage();

          if (en_cnt <= BOSS_CHG_NUM){
            //雑魚
            t_enc=0;
            //enc合計値取得
            for(i=0;i<ENEMY_NUM;i++){
              if ((t_stage == cls_EnAry[i].myStage)
                &&(!cls_EnAry[i].myBoss)) {

                t_enc += cls_EnAry[i].myEnc;
              }
            }
            

            t_en_sel = Math.random()*
                        t_enc;
            enidx = -1;
            t_last_i = 0;
            t_encsum = 0;
            //敵キャラ確定
            for(i=0;i<ENEMY_NUM;i++){
              if (t_stage == cls_EnAry[i].myStage) {

                t_encsum += cls_EnAry[i].myEnc;

                if(t_en_sel < t_encsum) {
                  enidx = i;
                  break;
                }
                t_last_i = i;
              }
            }

            //見つからなかったら最後の子
            if (enidx == -1) {
              enidx = t_last_i;
            }

          } else {
            //ボス
            for(i=0;i<ENEMY_NUM;i++){
              if ((t_stage == cls_EnAry[i].myStage)
                &&(cls_EnAry[i].myBoss)) {
                t_jdg = true;
                if (cls_EnAry[i].myEncFc != null){
                  t_jdg = cls_EnAry[i].myEncFc();

}

                if (t_jdg){
                  enidx = i;
                  break;
                }
              }
            }
            
          }

          cls_EnAry[enidx].myLife = cls_EnAry[enidx].myLifeMax;
          
          cls_EnDmg.myNoDisp = false;
          cls_EnDmg.myNoMCnt = 0;
             
          if (getStageEnd() == false){
                t_xinit = true;
                en_xnodisp = false;
          }

        }
        drawEnemyChara(cls_EnAry[enidx],           
                       t_xinit);
        
    }

    function drawEnemyCommon(cls_En) {

        nodisp = cls_EnDmg.myNoDisp;
        no_mcnt = cls_EnDmg.myNoMCnt;
        drwcnt = cls_En.myDrwCnt;
        up = cls_En.myUp;
        dx = cls_En.myDispX;
        dy = cls_En.myDispY;

        if ((dx <= -BLOCK_WH*2)
            ||(dx >= (GAME_WIDTH + BLOCK_WH*2))
            ||(dy <= (0 - BLOCK_WH*2))
            ||(dy >= (GAME_HEIGHT + BLOCK_WH*2))
        ) 
        {
            en_xnodisp = true;
            enemy_crash_flag = false;
        }

        drwcnt += get_move_spd();
            
        //上下の動き
        if (get_move_ok() == true) {
            if (drwcnt > 80) {
                drwcnt = 0;
                if (up == false) {
                    up = true;
                } else {
                    up = false;
                }
            }

            if (up == 1) {
                dy -= BLOCK_WH/10;
            }
        }


        t_rad = cls_En.myAngle * Math.PI/180;
        can.save();   //保存して後で復活
        
        t_cx = dx + cls_En.myDispW/2;
        t_cy = dy + cls_En.myDispH/2;

        // 画像を回転
        can.setTransform(Math.cos(t_rad), 
            Math.sin(t_rad), 
           -Math.sin(t_rad), 
            Math.cos(t_rad),
            t_cx-t_cx*Math.cos(t_rad)+t_cy*Math.sin(t_rad),
            t_cy-t_cx*Math.sin(t_rad)-t_cy*Math.cos(t_rad));

        if (!nodisp) {
            can.drawImage(
                  cls_En.myImg, 0, 0, 
                  cls_En.myImg.naturalWidth,     
                  cls_En.myImg.naturalHeight,
                  dx,
                  dy,
                  cls_En.myDispW,    
                  cls_En.myDispH); 
        }

        can.restore(); //復活

        //バー
        if (cls_En.myLife > 0){
          if(cls_En.myBoss) {
              varw = 100;
          } else {
              varw = 50;
          }
          lifex = dx 
                + (cls_En.myDispW / 2)
                - varw / 2;
        
          can.fillStyle = "#000000";
          can.fillRect(lifex, dy-10, varw, 5);

          t_val = (cls_En.myLife/
                 cls_En.myLifeMax)
                *(varw * 0.98)
          can.fillStyle = "#FF0000";
          can.fillRect(lifex+1, dy-9, t_val, 3);
        }

        //ダメージ
        if (cls_EnDmg.myCnt < DMGCNTMAX) {
          if (cls_EnDmg.myCrt) {
            can.font = '20pt Arial';
            can.fillStyle = 'red';
          } else {
            can.font = '15pt Arial';
            can.fillStyle = 'white';
          }
          can.fillText(cls_EnDmg.myNum,       
                       cls_EnDmg.myX +1, 
                       cls_EnDmg.myY +1- cls_EnDmg.myCnt/2);
          if (cls_EnDmg.myCrt) {
            can.font = '20pt Arial';
            can.fillStyle = 'white';
          } else {
            can.font = '15pt Arial';
            can.fillStyle = 'black';
          }
          can.fillText(cls_EnDmg.myNum,       
                       cls_EnDmg.myX, 
                       cls_EnDmg.myY - cls_EnDmg.myCnt/2);

          cls_EnDmg.myCnt++;

        }


        if (no_mcnt > 0){//敵無敵期間

          no_mcnt--;
          
          if ((no_mcnt % 10)==0) {
            if (nodisp){
              nodisp = false;
            } else {
              nodisp = true;
            }
          }
        } else {
           nodisp = false;
        }

        cls_En.myDrwCnt = drwcnt;
        cls_En.myUp = up;
        cls_EnDmg.myNoDisp = nodisp;
        cls_EnDmg.myNoMCnt = no_mcnt;
    }

    function enemyCrash(t_dmg) {
      t_life0 = false;
      
      if (cls_EnDmg.myNoMCnt <= 0) {
        //敵ライフへる
        t_random = Math.random();
        crt_ofs = 1;
        crt = false;
        if (t_random < (getCrt())) {
            crt_ofs = 1.5;
            crt = true;

        }
        dmgk = 10 + 1 * cls_Mc.myLevel ;
        dmg_c = Math.ceil(t_dmg *  dmgk * 10*crt_ofs);

        cls_EnCom.myLife -= dmg_c;
        cls_EnDmg.myNum = dmg_c;
        cls_EnDmg.myCnt = 0;
        cls_EnDmg.myX = cls_EnCom.myDispX;
        cls_EnDmg.myY = cls_EnCom.myDispY;
        cls_EnDmg.myCrt = crt;
      }
        
        if ((cls_EnCom.myLife <= 0) 
            &&(!enemy_crash_flag)) {
            t_life0 = true; //ライフ0
            if (cls_EnCom.myBoss){
              plus_exp(getStage()*10);
              updateStage();
              
              if (!get_enc_exist()){
                updateStage();
              }

              if(LAST_STAGE!=getStage()){
                en_cnt=0;//ボス出現条件クリア
              }
            }
            else {
              plus_exp(getStage());
            }

        } else {
            if (cls_EnDmg.myNoMCnt <= 0) {
                cls_EnDmg.myNoMCnt = NO_MMAX;

            }
        }
      

      if (t_life0) {
        if (!enemy_crash_flag) {
          enemy_crash_flag = true;

          t_ofs=Math.random() * 0.5;
          t_radian = (1.75+t_ofs)*3.14;
          en_crash_af_dx = Math.cos(t_radian)*10*get_move_spd();
          
          en_crash_af_dy = Math.sin(t_radian)*10*get_move_spd();

          if (get_move_ok()) {
              chg_score(25,
              cls_Mc.myDispX,
              cls_Mc.myDispY);
          }
        }
      }

    }

function ItemTask() {
  t_it_nodisp = get_it_nodisp();

  if (t_it_nodisp) {
    t_bosssel = getBossSel();

    // Boss戦特殊判定
    b_item6_enc = item6_enc;
    if (t_bosssel != 0) {
      b_item6_enc = item6_enc * 4;
    }

    item_sel = Math.random() *
      (noitem_enc +
        item1_enc +
        item2_enc +
        item5_enc +
        b_item6_enc +
        item7_enc +
        item8_enc +
        item9_enc +
        item10_enc +
        item11_enc 
      );

    t_xinit = true;
    it_xnodisp = false;
  }

  // アイテムと対応する描画関数の配列
  const items = [
    { threshold: noitem_enc, drawFunction: drawnoItem },
    { threshold: noitem_enc + item1_enc, drawFunction: drawItem1 },
    { threshold: noitem_enc + item1_enc + item2_enc, drawFunction: drawItem2 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc, drawFunction: drawItem5 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc + b_item6_enc, drawFunction: drawItem6 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc + b_item6_enc + item7_enc, drawFunction: drawItem7 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc + b_item6_enc + item7_enc + item8_enc, drawFunction: drawItem8 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc + b_item6_enc + item7_enc + item8_enc + item9_enc, drawFunction: drawItem9 },
    { threshold: noitem_enc + item1_enc + item2_enc + item5_enc + b_item6_enc + item7_enc + item8_enc + item9_enc + item10_enc, drawFunction: drawItem10 }
  ];

  // アイテムを選択し、対応する描画関数を呼び出す
  let selectedFunction = drawItem11; // デフォルトはdrawItem11
  for (const item of items) {
    if (item_sel <= item.threshold) {
      selectedFunction = item.drawFunction;
      break;
    }
  }

  // 選択された描画関数を実行する
  selectedFunction(t_xinit);

  // アイテム3例外処理
  t_xinit = false;
  if (!item3sel) {
    item3_disp = getEnemy3OkItemReq();

    if (item3_disp) {
      t_xinit = true;
      item3sel = true;
    }
  }

  if (item3sel) {
    drawItem3(t_xinit);
  }

  // アイテム4例外処理
  t_xinit = false;
  if (!item4sel) {
    item4_disp = getEnemy3NgItemReq();

    if (item4_disp) {
      t_xinit = true;
      item4sel = true;
    }
  }

  if (item4sel) {
    drawItem4(t_xinit);
  }
}

// イベントハンドラー(スマホタップ)
let startX = 0;
let startY = 0;
let fieldtapMask = false;

function touchStart(e) {
    e.preventDefault();
    startX = e.touches[0].pageX;
    startY = e.touches[0].pageY;

    if (!getStageEnd()) {
        if (!fieldtapMask) {
            if (getJustOk()) {
                setJustAttack();
            }

            if (cls_Mc.mySts == JUMP_END) {
                cls_Mc.mySts = JUMP_START;
            }
        }
        fieldtapMask = false;
    }
}

function touchStartField(e) {
    e.preventDefault();
    startX = e.touches[0].pageX;
    startY = e.touches[0].pageY;
    fieldtapMask = false;

    if (e.changedTouches.length == 1) {
        ret = pushStopRestart(
            pos(e.changedTouches[0])
        );
        if (!ret) {
            ret = pushSpAtkBtn(
                pos(e.changedTouches[0])
            );

            if (ret) {
                fieldtapMask = true;
            }
        }
        else {
            fieldtapMask = true;
        }
    }
}

function touchStartFieldFirst(e) {
    e.preventDefault();
    startX = e.touches[0].pageX;
    startY = e.touches[0].pageY;
    fieldtapMask = true;

    if (e.changedTouches.length == 1) {
        pushSelMainChara(
            pos(e.changedTouches[0])
        );

        pushGameStart(
            pos(e.changedTouches[0])
        );
    }
}


function pos(e) {
    var x, y;
    x = e.clientX - field.getBoundingClientRect().left;
    y = e.clientY - field.getBoundingClientRect().top;
    return [x, y];
}

function touchEnd(e) {
    e.preventDefault();
    tetroDown = false;
}

let StopRestart;
const GAME_STOP = 0;
const GAME_START = 1;
const SR_X = 20;
const SR_Y = 490;
const SR_H = 19;
var sr_rectw;

function initStopRestart() {
    StopRestart = GAME_START;
}

function drawStopRestart() {
    if (StopRestart === GAME_START) {
        t_sr = 'STOP';
        sr_rectw = 58;
    } else {
        t_sr = 'RESTART';
        sr_rectw = 98;
    }

    can.fillStyle = "#555555";
    can.fillRect(SR_X - 2, SR_Y - SR_H + 2, sr_rectw, SR_H);

    can.font = '15pt Arial';
    can.fillStyle = 'black';
    can.fillText(t_sr, SR_X + 1, SR_Y + 1);
    can.fillText(t_sr, SR_X - 1, SR_Y - 1);
    can.fillText(t_sr, SR_X - 1, SR_Y + 1);
    can.fillText(t_sr, SR_X + 1, SR_Y - 1);

    can.fillStyle = 'white';
    can.fillText(t_sr, SR_X, SR_Y);
}

function pushStopRestart(tap) {
    // tap 配列から X と Y 座標を抽出
    const tapx = tap[0];
    const tapy = tap[1];
    let ret = false;

    if (SR_X < tapx && tapx < (SR_X + sr_rectw) &&
        (SR_Y - 15) < tapy && tapy < (SR_Y + SR_H + 10)) {
        if (StopRestart === GAME_START) {
            StopRestart = GAME_STOP;
            clearInterval(main_task_timer);
        } else {
            StopRestart = GAME_START;
            main_task_timer = setInterval(maintask, 10);
        }
        drawStopRestart();
        ret = true;
    }

    return (ret);
}
