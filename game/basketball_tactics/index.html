<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a1e">
<title>BASKETBALL TACTICS 〜コートの支配者〜</title>
<style>
:root{--navy:#050a1e;--navy2:#0b1636;--blue:#2ea8ff;--blue2:#1f6bff;--orange:#ff8a1f;--yellow:#ffd23f;--red:#ff3b4a;--green:#35ff8a;--ink:#e8f1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,#12307a 0%,#0a1740 38%,#050a1e 78%)}
.screen{display:none;position:absolute;top:0;bottom:0;left:50%;width:100%;max-width:560px;transform:translateX(-50%);flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.screen.active{display:flex}
/* ---------- title ---------- */
#scTitle{align-items:center;justify-content:center;gap:12px;overflow-y:auto}
.title-bg{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
 radial-gradient(circle at 50% 108%,transparent 0 30%,rgba(46,168,255,.55) 30.4% 31%,transparent 31.4%),
 linear-gradient(90deg,transparent 0 33%,rgba(46,168,255,.35) 33% 33.4%,transparent 33.4% 66.6%,rgba(46,168,255,.35) 66.6% 67%,transparent 67%)}
.logo-box{text-align:center;position:relative;margin-top:4px}
.logo1{font:900 italic clamp(34px,11vw,58px)/1 "Arial Black",Impact,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 0 8px var(--blue),0 0 22px var(--blue2),0 3px 0 #0a2a80}
.logo2{font:900 italic clamp(40px,14vw,72px)/1 "Arial Black",Impact,sans-serif;letter-spacing:4px;background:linear-gradient(180deg,#fff27a,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,138,31,.8))}
.sub{margin-top:6px;font-weight:800;letter-spacing:3px;color:#9fd8ff;font-size:clamp(12px,3.6vw,16px)}
.rank-card{position:relative;width:100%;background:linear-gradient(180deg,rgba(18,48,122,.7),rgba(8,18,52,.8));border:1px solid rgba(46,168,255,.6);box-shadow:0 0 18px rgba(46,168,255,.25) inset;border-radius:14px;padding:10px 14px}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank-name{font:900 italic 22px/1 "Arial Black",Impact,sans-serif}
.rank-sub{font-size:12px;color:#9fc3ff}
.xpbar{height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow));box-shadow:0 0 10px var(--yellow);transition:width .6s}
.menu{position:relative;width:100%;display:grid;gap:10px}
.mbtn{position:relative;text-align:left;border-radius:14px;padding:12px 14px 12px 64px;min-height:68px;background:linear-gradient(180deg,#143a9a,#0c2160);border:2px solid var(--blue);box-shadow:0 0 14px rgba(46,168,255,.45),inset 0 0 18px rgba(46,168,255,.2);transition:transform .08s}
.mbtn:active{transform:scale(.97)}
.mbtn .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:30px;width:42px;text-align:center}
.mbtn b{display:block;font:900 italic 20px/1.1 "Arial Black",Impact,sans-serif;letter-spacing:1px}
.mbtn span{display:block;font-weight:800;font-size:14px;margin-top:2px}
.mbtn small{display:block;font-size:11px;color:#a9c8ff;margin-top:2px}
.m1{border-color:var(--orange);box-shadow:0 0 16px rgba(255,138,31,.55),inset 0 0 18px rgba(255,138,31,.2);background:linear-gradient(180deg,#a14a08,#5c2603)}
.m3{border-color:var(--yellow);box-shadow:0 0 16px rgba(255,210,63,.5),inset 0 0 18px rgba(255,210,63,.16);background:linear-gradient(180deg,#7a5f00,#3f3000)}
.mini-row{position:relative;display:flex;gap:10px;width:100%}
.minibtn{flex:1;min-height:44px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);font-weight:800;font-size:14px}
/* ---------- game ---------- */
#hud{flex:none}
.hud-top{display:flex;align-items:center;gap:6px}
.hud-logo{flex:1;font:900 italic 15px/1 "Arial Black",Impact,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 0 8px var(--blue)}
.hud-logo em{font-style:italic;color:var(--orange)}
.iconbtn{width:38px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-size:16px}
.chips{display:grid;grid-template-columns:1.25fr 1fr 1fr 1.25fr;gap:5px;margin-top:5px}
.chip{background:linear-gradient(180deg,rgba(20,58,154,.85),rgba(8,24,70,.85));border:1px solid rgba(46,168,255,.55);border-radius:9px;padding:3px 6px;font-size:10px;font-weight:800;color:#9fc3ff;line-height:1.15;text-align:center;min-width:0;white-space:nowrap}
.chip b{display:block;font:900 15px/1.1 "Arial Black",Impact,sans-serif;color:#fff}
.chip.combo b{color:var(--orange)}
.chip.rank b{font-size:12px;letter-spacing:.5px}
#hud .xpbar{margin-top:5px;height:6px}
#courtWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:6px 0}
#courtBox{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(46,168,255,.7),0 0 22px rgba(46,168,255,.5)}
#court{display:block;width:100%;height:100%}
#fxLayer{position:absolute;inset:0;pointer-events:none}
#courtBox.flash-good{animation:fg .9s}
#courtBox.flash-bad{animation:fb .9s}
@keyframes fg{0%{box-shadow:0 0 0 3px #fff,0 0 60px 14px rgba(255,210,63,.95)}100%{box-shadow:0 0 0 2px rgba(46,168,255,.7),0 0 22px rgba(46,168,255,.5)}}
@keyframes fb{0%{box-shadow:0 0 0 3px #ffb061,0 0 40px 8px rgba(255,138,31,.7)}100%{box-shadow:0 0 0 2px rgba(46,168,255,.7),0 0 22px rgba(46,168,255,.5)}}
.burst{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);white-space:nowrap;font:900 italic clamp(30px,9.5vw,56px)/1 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 0 6px var(--yellow),0 0 22px var(--orange),0 3px 0 #7a3b00;animation:pop 1.25s ease-out forwards}
.burst.miss{font-size:clamp(22px,7vw,38px);color:#ffe3c2;text-shadow:0 0 8px var(--orange),0 2px 0 #5a2a00}
.burst.combo{top:16%;font-size:clamp(20px,6vw,32px);color:var(--yellow)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-6deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(2deg)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#panel{flex:none;background:linear-gradient(180deg,rgba(14,36,96,.92),rgba(6,14,40,.96));border:1px solid rgba(46,168,255,.55);border-radius:14px;padding:8px 10px;box-shadow:0 0 16px rgba(46,168,255,.25)}
.qhead{display:flex;align-items:center;gap:6px}
.qtag{flex:none;font:900 italic 10px/1 "Arial Black",Impact,sans-serif;background:var(--orange);color:#1a0b00;padding:3px 7px;border-radius:6px;letter-spacing:.5px}
.qtheme{font-weight:900;font-size:13px;color:var(--yellow);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qtext{margin:5px 0 4px;font-weight:800;font-size:14px;line-height:1.4}
.qchips{display:flex;flex-wrap:wrap;gap:4px;min-height:19px}
.qchips span{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:rgba(46,168,255,.18);border:1px solid rgba(46,168,255,.5);color:#bfe2ff}
.qhint{font-size:12px;font-weight:800;color:var(--green);line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.opt{display:flex;align-items:center;gap:7px;text-align:left;min-height:54px;padding:6px 9px;border-radius:12px;background:linear-gradient(180deg,#1b4fd0,#102f8c);border:2px solid #5aa9ff;box-shadow:0 3px 0 #08184f,0 0 12px rgba(46,168,255,.35);font-weight:900;font-size:14px;line-height:1.25;transition:transform .08s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #08184f}
.opt i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:#1a1200;font:900 13px/24px "Arial Black",Impact,sans-serif;text-align:center;font-style:normal}
.opt.picked{border-color:var(--yellow);box-shadow:0 0 18px var(--yellow)}
.opt:disabled{opacity:.55}
.prow{display:flex;gap:8px;margin-top:7px}
.hintbtn{flex:1;min-height:38px;border-radius:10px;background:rgba(53,255,138,.14);border:1.5px solid var(--green);color:#c9ffe0;font-weight:900;font-size:13px}
.hintbtn:disabled{opacity:.5}
.reshead{display:flex;align-items:baseline;gap:8px}
.restitle{font:900 italic 22px/1 "Arial Black",Impact,sans-serif}
.restitle.good{color:var(--green);text-shadow:0 0 12px rgba(53,255,138,.8)}
.restitle.bad{color:var(--orange);text-shadow:0 0 12px rgba(255,138,31,.7)}
.resxp{font-weight:900;color:var(--yellow);font-size:14px}
.ressub{font-size:12px;font-weight:800;margin-top:3px;color:#ffd9b0;line-height:1.35}
.ressub b{color:var(--green)}
.exp{margin-top:5px;display:grid;gap:4px}
.exp div{font-size:12px;line-height:1.4;font-weight:600;color:#dbe9ff}
.exp b{display:inline-block;margin-right:4px;color:var(--yellow);font-weight:900}
.resbtns{display:flex;gap:6px;margin-top:7px}
.rbtn{flex:1;min-height:46px;border-radius:12px;font-weight:900;font-size:13px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);line-height:1.2}
.rbtn.main{flex:1.4;background:linear-gradient(180deg,#ff9d3d,#e3640a);border-color:#ffd08a;color:#2a1100;font-size:15px;box-shadow:0 3px 0 #7b3a05}
.rbtn:disabled{opacity:.4}
.hide{display:none!important}
/* ---------- stats ---------- */
#scStats{overflow-y:auto;gap:10px}
.stitle{font:900 italic 24px/1 "Arial Black",Impact,sans-serif;text-align:center;margin:8px 0 2px;color:var(--yellow);text-shadow:0 0 12px var(--orange)}
.card{background:linear-gradient(180deg,rgba(18,48,122,.7),rgba(8,18,52,.8));border:1px solid rgba(46,168,255,.55);border-radius:14px;padding:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font:900 22px/1.1 "Arial Black",Impact,sans-serif;color:#fff}
.grid3 span{font-size:11px;color:#9fc3ff;font-weight:800}
.trow{display:grid;grid-template-columns:1fr 70px 46px;gap:6px;align-items:center;font-size:12px;font-weight:700;margin-top:6px}
.tbar{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(3,6,20,.82)}
.overlay.show{display:flex}
.overlay.center{align-items:center}
.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#10286c,#07123a);border:2px solid var(--blue);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -6px 30px rgba(46,168,255,.35)}
.sheet h2{margin:0 0 4px;font:900 italic 22px/1.1 "Arial Black",Impact,sans-serif;color:var(--yellow)}
.sheet p{margin:0 0 10px;font-size:13px;color:#b7d3ff;font-weight:700}
.lvrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.lv{min-width:58px;min-height:44px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);font-weight:900;font-size:14px;line-height:1.1}
.lv small{display:block;font-size:9px;font-weight:700;color:#9fc3ff}
.lv.sel{background:linear-gradient(180deg,#ff9d3d,#e3640a);border-color:#ffd08a;color:#2a1100}
.lv.sel small{color:#4a2200}
.lv:disabled{opacity:.4}
.catlist{display:grid;gap:8px;margin-bottom:10px}
.cat{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 12px;border-radius:12px;background:linear-gradient(180deg,#1b4fd0,#102f8c);border:2px solid #5aa9ff;font-weight:900;font-size:15px}
.cat span{font-size:22px;width:30px;text-align:center}
.cat small{display:block;font-size:11px;font-weight:700;color:#bcd6ff}
.bigbtn{width:100%;min-height:54px;border-radius:14px;font:900 italic 18px/1 "Arial Black",Impact,sans-serif;background:linear-gradient(180deg,#ff9d3d,#e3640a);border:2px solid #ffd08a;color:#2a1100;box-shadow:0 4px 0 #7b3a05;letter-spacing:1px}
.bigbtn.sec{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:none;margin-top:8px;font-size:15px;min-height:46px;font-style:normal;font-family:inherit}
#ovMsg .box{position:relative;width:min(92%,420px);text-align:center;padding:26px 18px 18px;border-radius:20px;border:2px solid var(--yellow);background:radial-gradient(circle at 50% 0,#27439a,#07123a 70%);box-shadow:0 0 40px rgba(255,210,63,.55);overflow:hidden}
#ovMsg .rays{position:absolute;left:50%;top:70px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,210,63,.22) 0 8deg,transparent 8deg 20deg);animation:spin 9s linear infinite;pointer-events:none;border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
#ovMsg .mt{position:relative;font:900 italic 36px/1.05 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 0 14px var(--yellow),0 3px 0 #7a5200;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#ovMsg .mr{position:relative;font:900 italic 30px/1.1 "Arial Black",Impact,sans-serif;margin:12px 0 6px}
#ovMsg .mb{position:relative;font-size:14px;font-weight:700;color:#d9e8ff;line-height:1.5;margin-bottom:14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:60;background:#0b1f5a;border:2px solid var(--yellow);padding:8px 14px;border-radius:12px;font-weight:900;font-size:13px;box-shadow:0 0 18px rgba(255,210,63,.6)}

/* ---------- scenario mode ---------- */
/* ---------- fx layers ---------- */
#dimLayer,#whiteLayer{position:absolute;inset:0;pointer-events:none;opacity:0}
#dimLayer{background:rgba(0,0,12,.66);transition:opacity .3s}
#dimLayer.on{opacity:1}
#whiteLayer{background:#fff}
#whiteLayer.on{animation:wfl .38s ease-out}
@keyframes wfl{0%{opacity:.75}100%{opacity:0}}
#court.sh1{animation:sh1 .28s linear}
#court.sh2{animation:sh2 .4s linear}
@keyframes sh1{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}
@keyframes sh2{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,2px)}25%{transform:translate(5px,-3px)}40%{transform:translate(-4px,-2px)}55%{transform:translate(4px,3px)}70%{transform:translate(-2px,1px)}85%{transform:translate(1px,-1px)}}
#courtBox{transition:transform .18s}
.ft{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;pointer-events:none;opacity:0;max-width:100%}
.ft b{display:block;font:900 italic clamp(24px,8vw,48px)/1 "Arial Black",Impact,sans-serif;letter-spacing:1px;color:#fff}
.ft.long b{font-size:clamp(20px,6.6vw,40px)}
.ft small{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:20px;background:rgba(5,10,30,.86);font:900 clamp(12px,3.5vw,16px)/1.3 sans-serif;color:#fff;border:1.5px solid}
.ft.blue b{text-shadow:0 0 8px #2ea8ff,0 0 22px #2ea8ff,0 3px 0 #002a80}
.ft.blue small{border-color:#5aa9ff}
.ft.red b{color:#fff1de;text-shadow:0 0 8px #ff3b4a,0 0 22px #ff8a1f,0 3px 0 #6a0010}
.ft.red small{border-color:#ff6a77}
.ft.t0 b{font-size:clamp(20px,6.4vw,38px)}
.ft.t0.long b{font-size:clamp(18px,5.6vw,32px)}
.ft.t2 b,.ft.t3 b{color:#fff7c2;text-shadow:0 0 10px #ffd23f,0 0 28px #ff8a1f,0 3px 0 #7a3b00}
.ft.t3 b{font-size:clamp(24px,8.4vw,46px)}
.ft.t3.long b{font-size:clamp(16px,5.3vw,34px)}
.ft.long.on{animation-name:ftinL}
@keyframes ftinL{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-78%) scale(1.02)}}
.ft.on{animation:ftin 1s ease-out forwards}
.ft.t1.on{animation-duration:1.3s}.ft.t2.on{animation-duration:1.8s}.ft.t3.on{animation-duration:2.3s}
@keyframes ftin{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-5deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(1.5deg)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-78%) scale(1.04)}}
.fc{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;white-space:nowrap}
.fc b{font:900 italic clamp(18px,5.6vw,30px)/1 "Arial Black",Impact,sans-serif;color:#ffe680;text-shadow:0 0 8px #ffd23f,0 2px 0 #7a3b00}
.fc.c3 b{color:#ffb061;text-shadow:0 0 10px #ff6a2a,0 0 20px #ff3b1a,0 2px 0 #5a1500;font-size:clamp(20px,6.4vw,34px)}
.fc.c4 b{font-size:clamp(22px,7.4vw,40px);background:linear-gradient(90deg,#fff,#ffd23f,#ff8a1f,#ff3b4a,#ffd23f,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #ff8a1f);animation:rbw .6s linear infinite}
@keyframes rbw{to{background-position:200% 0}}
.fc.on{animation:fcin .9s ease-out forwards}
.fc.c4.on{animation-duration:1.3s}
@keyframes fcin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}28%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.burst.bignum{top:52%;font-size:clamp(54px,20vw,110px);color:#fff7c2;text-shadow:0 0 12px #ffd23f,0 0 36px #ff8a1f,0 5px 0 #7a3b00;animation-duration:1.1s}

#scoreBar{display:none;flex:none;margin-top:5px;align-items:stretch;gap:5px}
.scn #scoreBar{display:flex}
.sb-team{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:3px 6px 1px;border:2px solid;position:relative;transition:transform .2s,box-shadow .2s;min-width:0}
.sb-team .nm{font:900 italic 12px/1 "Arial Black",Impact,sans-serif;letter-spacing:1px;white-space:nowrap}
.sb-team .nm small{display:block;font:800 9px/1.2 sans-serif;letter-spacing:0;opacity:.85;margin-top:1px}
.sb-team b{font:900 34px/1.05 "Arial Black",Impact,sans-serif;min-width:34px;text-align:center}
.sb-team.red{background:linear-gradient(180deg,rgba(255,59,74,.32),rgba(120,10,25,.5));border-color:#ff6a77;color:#ffd5d9}
.sb-team.blue{background:linear-gradient(180deg,rgba(46,168,255,.34),rgba(10,40,120,.55));border-color:#5aa9ff;color:#d7ecff}
.sb-team.ball{box-shadow:0 0 16px currentColor;transform:scale(1.03)}
.sb-team.pulse{animation:sbpulse .55s ease-in-out 3}
@keyframes sbpulse{50%{transform:scale(1.14);box-shadow:0 0 30px currentColor,0 0 0 3px #fff}}
.sb-mid{flex:.8;text-align:center;border-radius:12px;border:1.5px solid rgba(255,210,63,.7);background:rgba(8,18,52,.88);padding:2px 3px;line-height:1.1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.sb-mid .p{font:900 italic 9px/1.1 "Arial Black",Impact,sans-serif;color:var(--yellow);letter-spacing:1px}
.sb-mid .dash{font:900 24px/1 "Arial Black",Impact,sans-serif;color:#fff}
.sb-mid .c{font:900 15px/1.1 "Arial Black",Impact,sans-serif;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 8px var(--blue)}

<!-- ============================================================
     ENGINE  (問題生成ロジック: 描画から完全に分離)
     ============================================================ -->
<script id="engine">
'use strict';
/* ---------- basic utils ---------- */
const W=100,H=88,GOAL={x:50,y:9},FREE_D=11,SEP=8,XMIN=8,XMAX=92,YMIN=13,YMAX=82;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const sd=()=>Math.random()<.5?-1:1;
const P=(x,y)=>({x,y});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function segPoint(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy;let t=l2?((p.x-a.x)*vx+(p.y-a.y)*vy)/l2:0;t=Math.max(0,Math.min(1,t));return {x:a.x+vx*t,y:a.y+vy*t,t};}
function segDist(p,a,b){const q=segPoint(p,a,b);return Math.hypot(p.x-q.x,p.y-q.y);}
function nearest(list,pos){let d=999,f=null;for(const o of list){const k=dist(o,pos);if(k<d){d=k;f=o;}}return {d,f};}
function minSeg(list,a,b){let d=999,f=null;for(const o of list){const k=segDist(o,a,b);if(k<d){d=k;f=o;}}return {d,f};}
const sw=p=>p.x<44?'左':p.x>56?'右':'まんなか';
const opp=s=>s==='左'?'右':s==='右'?'左':'はんたい';
const lerpP=(a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
function posWord(p){return dist(p,GOAL)<17?'ゴールの下':sw(p);}

/* ---------- level config ---------- */
const LEVELS={1:{foes:2,mates:1},2:{foes:3,mates:2},3:{foes:3,mates:2},4:{foes:4,mates:2},5:{foes:5,mates:4}};

/* ---------- evaluation (状況評価: 正解は距離だけで決めない) ---------- */
// シュートの打ちやすさ: ゴールまでの距離 × ディフェンスとの距離 × シュートコースの邪魔
function shotQ(foes,pos){
  const d=dist(pos,GOAL);
  const ds=d<=12?100:d<=20?100-(d-12)*3.5:d<=32?72-(d-20)*3.5:d<=42?30-(d-32)*2:6;
  const nd=nearest(foes,pos).d;
  let os=nd>=14?100:nd<=5?10:10+(nd-5)*10;
  for(const f of foes){if(segDist(f,pos,GOAL)<5&&dist(f,GOAL)<d){os*=.6;break;}}
  return ds*(0.35+0.65*os/100);
}
// パスを受ける価値: パスコース・距離・受け手のフリー度・受け手のシュート
function recvEval(foes,hp,q){
  const m=minSeg(foes,hp,q),pd=dist(hp,q),open=nearest(foes,q).d;
  const laneClear=m.d>=6.5&&pd<=55&&pd>=6;
  let score=28+0.45*shotQ(foes,q)+2.2*Math.min(open,14)-0.2*pd;
  if(open<FREE_D)score=Math.min(score,40);
  if(!laneClear)score=Math.min(score,10);
  return {score,lane:m.d,lf:m.f,pd,open,laneClear};
}
function evalShoot(sc){
  const p=sc.me,f=sc.foes,sq=shotQ(f,p),nd=nearest(f,p).d,d=dist(p,GOAL);
  let out,why='';
  if(sq>=60)out='score';
  else if(nd<9.8){out='block';why='てきが ちかくて ブロックされそう';}
  else if(sq<35){out='miss';why=d>30?'ゴールから とおくて はいりにくいよ':'まだ いい チャンスじゃ ないよ';}
  else{out='weak';why='うてるけど、もっと いい ばしょが あるよ';}
  return {score:sq,out,why,type:'shoot'};
}
function evalPass(sc,k){
  const m=sc.mates[k],p=sc.me,r=recvEval(sc.foes,p,m);
  let out='ok',why='';
  if(!r.laneClear){
    if(r.pd>55){out='steal';why='とおすぎて ボールが とどかないよ';}
    else if(r.lf&&dist(r.lf,m)<FREE_D-0.5&&dist(r.lf,m)<dist(r.lf,p)){out='covered';why='みかたに てきが ついているよ';}
    else{out='steal';why='パスの とちゅうに てきが いて とられそう';}
  }else if(r.open<FREE_D){out='covered';why='みかたに てきが ついているよ';}
  return {...r,out,why,type:'pass'};
}
function dribbleSpots(sc){
  const p=sc.me,out={},d=dist(p,GOAL);
  if(d>=20){const t=Math.min(16,d-10)/d;out.goal=P(p.x+(GOAL.x-p.x)*t,p.y+(GOAL.y-p.y)*t);}
  for(const [k,s] of [['left',-1],['right',1]]){const x=clamp(p.x+s*18,XMIN+2,XMAX-2);if(Math.abs(x-p.x)>=10)out[k]=P(x,Math.max(YMIN,p.y-6));}
  return out;
}
function evalDribble(sc,dir,spot){
  const p=sc.me;
  const dirS=dir==='right'?1:dir==='left'?-1:0;
  const skip=(sc.screen&&dirS===sc.screen.side)?sc.screen.foe:-1;
  const list=sc.foes.filter((f,i)=>i!==skip);
  const path=minSeg(list,p,spot),dm=dist(p,spot);
  let margin=999,stopper=null;
  for(const f of list){const m=dist(f,spot)-dm;if(m<margin){margin=m;stopper=f;}}
  const open=nearest(list,spot).d;
  let score,out='ok',why='';
  if(path.d<6||margin<2.5){
    out='stop';score=14+Math.max(-6,Math.min(margin,2.5));
    stopper=path.d<6?path.f:stopper;
    why=path.d<6?'まえに てきが いて ぶつかりそう':'てきが さきに まわりこんで とめられそう';
  }else{
    score=30+Math.min(margin,12)*1.8+Math.min(open,14)*1.2+0.4*shotQ(list,spot);
    if(skip>=0)score+=8;
  }
  return {score,out,why,spot,stopper,margin,open,type:'dribble',screened:skip>=0};
}
function offSpots(sc){
  const p=sc.me,h=sc.mates[sc.holder],out={},d=dist(p,GOAL);
  if(d>16){const t=Math.min(22,d-9)/d;out.cut=P(p.x+(GOAL.x-p.x)*t,p.y+(GOAL.y-p.y)*t);}
  for(const [k,s] of [['left',-1],['right',1]]){const x=clamp(p.x+s*18,XMIN+2,XMAX-2);if(Math.abs(x-p.x)>=10)out[k]=P(x,Math.max(YMIN,p.y-2));}
  const dh=dist(p,h);
  if(dh>=22){const t=14/dh;out.ball=P(p.x+(h.x-p.x)*t,p.y+(h.y-p.y)*t);}
  out.stay=P(p.x,p.y);
  return out;
}
function evalOff(sc,key,spot){
  const p=sc.me,h=sc.mates[sc.holder],foes=sc.foes;
  const hp=sc.drive?sc.drive.to:h;
  const r=recvEval(foes,hp,spot);
  let score=r.score,out='ok',why='';
  const pf=key==='stay'?{d:99,f:null}:minSeg(foes,p,spot);
  let driveBlock=false;
  if(sc.drive){const dd=segDist(spot,sc.drive.from,sc.drive.to);if(dd<12){driveBlock=true;score-=(12-dd)*3+15;}}
  if(pf.d<5){score-=18;}
  if(key==='stay')score-=4;
  if(key==='ball')score-=4;
  if(driveBlock){out='drive';why='みかたの ドリブルの じゃまに なっちゃうよ';}
  else if(pf.d<5){out='bump';why='はしる みちに てきが いて ぶつかりそう';}
  else if(!r.laneClear){
    if(r.lf&&dist(r.lf,spot)<FREE_D-0.5){out='covered';why='そこは てきが ちかくて パスを もらいにくいよ';}
    else{out='steal';why='みかたから パスが とどくまえに てきに とられそう';}
  }else if(r.open<FREE_D){out='covered';why=key==='stay'?'その ばしょは てきが ちかくて パスが もらえないよ':'そこは てきが ちかくて パスを もらいにくいよ';}
  return {score,out,why,spot,lane:r.lane,lf:r.lf,open:r.open,laneClear:r.laneClear,pd:r.pd,pathFoe:pf.f,type:'off'};
}
function evaluateAll(sc){
  const ev={};
  if(sc.holder==='me'){
    ev.shoot=evalShoot(sc);
    sc.mates.forEach((m,i)=>{ev['pass'+i]=evalPass(sc,i);});
    const sp=dribbleSpots(sc);
    for(const k in sp)ev['dribble_'+k]=evalDribble(sc,k,sp[k]);
  }else{
    const sp=offSpots(sc);
    for(const k in sp)ev['off_'+k]=evalOff(sc,k,sp[k]);
  }
  return ev;
}
// 「出題意図(正解)」が本当に最良か、唯一の正解か、成立しているかを検証
function checkIntent(ev,intent){
  const arr=Object.entries(ev).sort((a,b)=>b[1].score-a[1].score);
  if(arr.length<3)return false;
  if(arr[0][0]!==intent)return false;
  if(arr[0][1].score-arr[1][1].score<10)return false;
  const e=ev[intent];
  if(e.score<48)return false;
  if(intent==='shoot')return e.out==='score';
  if(intent.startsWith('pass')||intent.startsWith('off_'))return e.out==='ok'&&e.open>=FREE_D&&e.laneClear;
  return e.out==='ok';
}

/* ---------- scenario placement helpers ---------- */
function inCourt(p){return p.x>=XMIN&&p.x<=XMAX&&p.y>=YMIN&&p.y<=YMAX;}
function baseLegal(sc){
  const all=[sc.me,...sc.mates,...sc.foes];
  for(const p of all)if(!inCourt(p))return false;
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(dist(all[i],all[j])<SEP)return false;
  return true;
}
function legalAt(sc,p){
  if(!inCourt(p))return false;
  if(dist(p,sc.me)<SEP)return false;
  for(const o of sc.mates)if(dist(o,p)<SEP)return false;
  for(const o of sc.foes)if(dist(o,p)<SEP)return false;
  return true;
}
const inProtect=(p,z)=>z.some(c=>dist(p,c)<c.r);
function addFillers(sc,nF,nM,prot,noPass){
  let t=0;
  while(sc.mates.length<nM&&t++<80){
    const p=P(rnd(10,90),rnd(16,76));
    if(legalAt(sc,p)&&!inProtect(p,prot)&&!(noPass&&recvEval(sc.foes,sc.me,p).score>=30))sc.mates.push({x:p.x,y:p.y,filler:true});
  }
  if(sc.mates.length<nM)return false;
  t=0;
  while(sc.foes.length<nF&&t++<140){
    const un=sc.mates.find(m=>m.filler&&!m.guarded);
    if(un){
      const dx=GOAL.x-un.x,dy=GOAL.y-un.y,l=Math.hypot(dx,dy)||1,r=rnd(8.4,10);

      explain:{situ:ex[0],why:ex[1],tip:ex[2]},prompt:buildPrompt(sc,th),chips:buildChips(sc),hintText:th.hint,hintDraw:buildHint(sc,ev)};

function makeQuestion(level,opts){
  opts=opts||{};

  if(opts.cats){const p2=pool.filter(t=>t.cat.some(c=>opts.cats.includes(c)));if(p2.length)pool=p2;}
  for(let i=0;i<14;i++){const q=tryTheme(chooseTheme(pool,level),level,i<10?160:500);if(q)return q;}
  for(const th of shuffle(pool)){const q=tryTheme(th,level,1500);if(q)return q;}
  throw new Error('question generation failed: level '+level);

function scnOpenMates(st){

/* ---------- defense reaction ---------- */
function scnSeparate(st){

    for(const o of st.off){const d=dist(f,o);if(d<SEP){if(d<.01){f.x+=1;continue;}const k=(SEP-d)/d;f.x+=(f.x-o.x)*k;f.y+=(f.y-o.y)*k;}}

function scnFoesOk(st){

    if(!inCourt(f))return false;

/* ---------- 味方の自動プレー ---------- */
function scnAuto(r){

function scnResolveOff(st,opt,options){

const DFN_TPL={
 dr(){const s=sd(),H=P(50+s*rnd(4,14),rnd(40,48)),hero=goalSide(H,rnd(8.6,9.4)),R2=P(50-s*rnd(14,24),rnd(26,36)),D2=goalSide(R2,rnd(8.6,9.4));
  return {off:[H,R2],foes:[hero,D2],pat:'drive',kind:'drive',flags:{}};},
 pass(){const s=sd(),H=P(50+s*rnd(10,20),rnd(42,52)),D1=goalSide(H,rnd(8.6,9.4)),R2=P(50-s*rnd(16,26),rnd(32,44)),hero=goalSide(R2,rnd(8.6,9.4)),
   R3=P(50+s*rnd(24,32),rnd(24,34)),D3=goalSide(R3,rnd(8.6,9.4));
  return {off:[H,R2,R3],foes:[hero,D1,D3],pat:'pass',kind:'pass',flags:{passTo:Math.random()<.55?1:2}};},
 help(){const s=sd(),H=P(50+s*rnd(2,10),rnd(20,26)),D1=P(H.x+s*rnd(4,6),H.y+rnd(7.8,8.6)),R2=P(50-s*rnd(14,22),rnd(30,38)),hero=goalSide(R2,rnd(8.6,9.4)),
   R3=P(50+s*rnd(26,32),rnd(44,52)),D3=goalSide(R3,rnd(8.6,9.4));
  return {off:[H,R2,R3],foes:[D1,hero,D3],hiSwap:true,pat:'help',kind:'shoot',flags:{beaten:true}};},
 two(){const s=sd(),H=P(50+s*rnd(8,16),rnd(40,48)),hero=goalSide(H,rnd(8.6,9.4)),R2=P(50-s*rnd(8,14),rnd(28,34)),D2=goalSide(R2,rnd(8.6,9.4));
  return {off:[H,R2],foes:[hero,D2],pat:'two',kind:'drive',flags:{two:true}};}
};
function dfnPlayers(st){
  const rp=shuffle([4,5,6,8,9,10,11,12,13,14,15]),bp=shuffle([4,5,6,8,9,10,11,12,13,14,15]);
  st.off.forEach(p=>{p.num=rp.pop();});
  st.foes.forEach((p,i)=>{p.num=i===st.hi?7:bp.pop();});
}
function dfnStart(level,o){
  o=o||{};const cl=clamp(level,1,5);
  const ids=cl===1?['dr']:cl===2?['pass']:cl===3?['help']:cl===4?['two']:['dr','pass','help','two'];
  for(let a=0;a<300;a++){
    const id=scnPick(ids),c=DFN_TPL[id]();
    const extra=cl===4?2:cl===5?(id==='pass'||id==='help'?1:2):0;
    const st={phase:'def',off:c.off.map(p=>({...p})),foes:c.foes.map(p=>({...p,man:-1})),h:0,hi:c.hiSwap?1:0,screen:null,
      flags:{...c.flags},themeId:'def_'+id,level:cl,style:'normal',time:o.time,us:o.us,them:o.them,turn:0,poss:o.poss||0,single:false,
      stats:o.stats||SCN_ZERO(),seen:{},lastPass:null,end:null};
    if(!dfnPairs(st,extra))continue;
    const all=[...st.off,...st.foes];let ok=true;
    for(const p of all)if(!inCourt(p))ok=false;
    for(let i=0;i<all.length&&ok;i++)for(let j=i+1;j<all.length;j++)if(dist(all[i],all[j])<SEP-.01){ok=false;break;}
    if(!ok)continue;
    dfnPlayers(st);scnAssignMen(st,13);
    st.maxTurns=Math.max(1,Math.min(DFN_TURNS[cl],Math.floor((o.time-1.2)/3)));
    dfnPrepare(st,c.kind);
    if(!st.intent)continue;
    st.tags=['RED TEAM ATTACK','のこり '+Math.ceil(st.time)+'びょう'];
    return st;
  }
  throw new Error('defense generation failed: level '+cl);
}
/* ---------- 相手AI: 何をしてくるか決める ---------- */
function dfnPrepare(st,force){
  const {ev,map}=scnEvalAll(st),list=[];
  list.push({k:'shoot',score:ev.shoot.score});
  map.forEach((oi,j)=>list.push({k:'pass',to:oi,score:ev['pass'+j].score}));
  for(const key of ['dribble_goal','dribble_left','dribble_right'])if(ev[key])list.push({k:'drive',key,spot:ev[key].spot,score:ev[key].score});
  let pool=force?list.filter(x=>x.k===(force==='shoot'?'shoot':force)):list;
  if(st.flags.passTo!=null&&force==='pass'){const t=pool.filter(x=>x.to===st.flags.passTo);if(t.length)pool=t;}
  if(!pool.length)pool=list;
  const w=pool.map(x=>force?1:Math.exp(x.score/18));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),pick0=pool[pool.length-1];
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){pick0=pool[i];break;}}
  st.intent=pick0;st.pat=dfnPattern(st,pick0);
  if(st.pat==='drive'||st.pat==='two'||st.pat==='help'){if(!st.intent.spot&&st.intent.k==='drive')st.intent.spot=st.off[st.h];}
}
function dfnPattern(st,it){
  if(st.flags.beaten)return 'help';
  if(it.k==='shoot')return 'shot';
  if(it.k==='pass')return 'pass';
  if(st.flags.two&&st.turn===0)return 'two';
  return dist(st.foes[st.hi],st.off[st.h])>15?'help':'drive';
}
const dfnHelperNear=(st,p)=>st.foes.some((f,i)=>i!==st.hi&&dist(f,p)<13);
function dfnP(st,key){
  const H=st.off[st.h],hero=st.foes[st.hi],it=st.intent,pat=st.pat;
  if(pat==='drive'||pat==='two'){
    const sp=it.spot||H,straight=Math.abs(sp.x-H.x)<12,hn=dfnHelperNear(st,sp);
    if(pat==='two')return key==='front'?(straight?.6:.42):key==='cut'?.48:(hn?.62:.5);
    return key==='front'?(straight?.72:.3):key==='slide'?(straight?.5:.74):.26+(hn?.4:0);
  }
  if(pat==='pass'){
    const mine=st.foes[st.hi].man===it.to;
    return key==='deny'?(mine?.72:.28):key==='ball'?(mine?.42:.38):(mine?.25:.62);
  }
  if(pat==='shot'){
    const dc=dist(hero,H);
    return key==='check'?clamp(1.05-dc/20,.25,.85):key==='chase'?clamp(.9-dc/22,.2,.6)*.8:.5;
  }
  const dh=dist(hero,H);
  return key==='help'?clamp(.85-dh/38,.3,.82):key==='stay'?.22:.5;
}
function dfnOptions(st){
  const list=DFN_OPTS[st.pat].map(([key,ic,label])=>({key,ic,label,p:dfnP(st,key),cat:'def'}));
  return shuffle(list);
}
const dfnDirWord=(st)=>{const H=st.off[st.h],sp=st.intent.spot||H,dx=sp.x-H.x;return Math.abs(dx)<12?'まっすぐ':dx>0?'右':'左';};
function dfnPrompt(st){
  const it=st.intent;
  if(st.pat==='drive')return {head:'てきが つっこんできた！',line:'てきは '+dfnDirWord(st)+'へ ドライブ！'};
  if(st.pat==='two')return {head:'ふたりで せめてきた！',line:'ボールを もった てきが ドライブ！ もう ひとりは ゴールへ カット！'};
  if(st.pat==='pass')return {head:'パスされそう！',line:'てきは '+st.off[it.to].num+'ばんへ パスしそう！'};
  if(st.pat==='shot')return {head:'シュートされる！',line:'てきが シュートを うつよ！'};
  return {head:'ぬかれた！',line:'ゴールの ちかくに てきが いる！ ヘルプに 行く？'};
}
function dfnHintText(st,options){
  const b=options.slice().sort((x,y)=>y.p-x.p)[0];
  const t={drive:'てきの すすむ ほうを みよう。',two:'あぶない ほうを みよう。',pass:'パスが いきそうな ひとを みよう。',shot:'シュートを うつ ひとに ちかい かな？',help:'ゴールに ちかい ひとを まもろう。'}[st.pat];
  return t+' 「'+b.label+'」が いいかも！';
}
function dfnArrows(st){
  const H=st.off[st.h],it=st.intent,a=[];
  if(it.k==='drive'&&it.spot)a.push({a:{x:H.x,y:H.y},b:{x:it.spot.x,y:it.spot.y},c:'#ff6a77',dash:true,w:1});
  else if(it.k==='pass')a.push({a:{x:H.x,y:H.y},b:{x:st.off[it.to].x,y:st.off[it.to].y},c:'#ff6a77',dash:true,w:1});
  else if(it.k==='shoot')a.push({a:{x:H.x,y:H.y},b:{x:GOAL.x,y:GOAL.y},c:'#ff6a77',dash:true,w:1});
  if(st.pat==='two'){const c=st.off[1];a.push({a:{x:c.x,y:c.y},b:{x:GOAL.x,y:GOAL.y+8},c:'#ff6a77',dash:true,w:.8});}
  return a;
}
function dfnEvents(st){
  const ev=[],key=id=>{if(st.seen[id])return false;st.seen[id]=1;return true;},d=st.us-st.them;
  if(st.pat==='help'&&key('help'+st.turn))ev.push({id:'HELP!',t:'ヘルプの チャンス！',ic:'🦸'});
  if(st.time<=5&&key('last'))ev.push({id:'LAST SECOND',t:'のこり '+Math.max(1,Math.ceil(st.time))+'びょう！',ic:'⏱️'});
  if(d>=0&&d<=2&&st.time<=12&&key('clutch'))ev.push({id:'CLUTCH',t:'ここを まもれば しょうり！',ic:'🔥'});
  return ev.slice(0,2);
}

/* ===== DEFENSE ENGINE 2: resolve / wrap / narrate ===== */
function dfnResolve(st,opt,options){
  const s=cloneSt(st);s.flags={...st.flags};s.intent={...st.intent};
  const steps=[],best=Math.max(...options.map(o=>o.p)),gap=best-opt.p,q=gap<=.08?'great':gap<=.25?'good':'weak';
  s.turn++;s.time=Math.max(0,+(s.time-3).toFixed(1));s.stats.decisions++;if(q!=='weak')s.stats.good++;if(q==='great')s.stats.smart++;
  const ok=Math.random()<opt.p,pat=st.pat,it=st.intent,hi=s.hi,key=opt.key;
  const H0={x:st.off[st.h].x,y:st.off[st.h].y},foeStart0=st.foes.map(f=>({x:f.x,y:f.y}));
  const info={opt,q,ok,pat,head:'',line:''};
  const snap=()=>({off:s.off.map(p=>({x:p.x,y:p.y})),foes:s.foes.map(f=>({x:f.x,y:f.y}))});
  const mv=(ms,dribble)=>steps.push({k:'move',...snap(),ms,dribble:!!dribble});
  const hero=()=>s.foes[hi];
  const react=(mode,keep)=>{const hp={x:hero().x,y:hero().y};scnReact(s,{mode,foeStart:foeStart0,dir:0});if(keep){hero().x=hp.x;hero().y=hp.y;}};
  const near=(p)=>{let d=999,k=0;s.foes.forEach((f,i)=>{const e=dist(f,p);if(e<d){d=e;k=i;}});return k;};
  const goto8=(f,from,d)=>{const l=dist(f,from)||1;f.x=from.x+(f.x-from.x)/l*d;f.y=from.y+(f.y-from.y)/l*d;};
  const shoot=(pm,o)=>{
    o=o||{};const p=s.off[s.h];s.time=Math.max(0,+(s.time-1.2).toFixed(1));
    const made=Math.random()<pm;
    steps.push({k:'shot',who:s.h,mode:made?'swish':(o.block?'block':(Math.random()<.5?'rim':'miss')),opp:true});
    s.end=made?{type:'rscore',pts:dist(p,GOAL)>42?3:2,by:s.h}:{type:'miss',block:!!o.block};
    return made;
  };
  const steal=(idx,at,head,line)=>{steps.push({k:'steal',foe:idx,at:{x:at.x,y:at.y},say:'ボールを とった！'});s.end={type:'steal'};info.head=head;info.line=line;};
  const passOut=(t)=>{
    steps.push({k:'pass',from:s.h,to:t});s.lastPass={from:s.h,to:t,turn:s.turn};s.h=t;
    react('pass',true);scnMoveMates(s,1);mv(640);
  };
  const baseMake=()=>clamp(.08+shotQ(s.foes,s.off[s.h])*.011,.08,.95);
  if(pat==='drive'||pat==='two'){
    const sp=it.spot||H0,spc={x:clamp(sp.x,XMIN,XMAX),y:clamp(sp.y,YMIN,YMAX)};
    const h=hero();
    if(key==='front'){const m=lerpP(h,H0,.2);h.x=m.x;h.y=m.y;goto8(h,H0,Math.max(8.1,dist(h,H0)-1.4));}
    else if(key==='slide'){h.x=clamp(h.x+clamp(spc.x-H0.x,-14,14)*.8,XMIN,XMAX);}
    else if(key==='trust'){const ti=s.foes.map((f,i)=>({i,d:dist(f,spc)})).filter(c=>c.i!==hi).sort((a,b)=>a.d-b.d)[0];if(ti){const t=s.foes[ti.i];goto8(t,spc,8.6);}}
    else if(key==='cut'){const c=s.off[1];if(c){const m=lerpP(c,GOAL,.35);h.x=h.x+(m.x-h.x)*.6;h.y=h.y+(m.y-h.y)*.6;}}
    else if(key==='sag'){h.x=h.x+(50-h.x)*.3;h.y=h.y+(20-h.y)*.25;}
    mv(520);
    if(ok){
      const mid=lerpP(H0,spc,.35);s.off[s.h].x=mid.x;s.off[s.h].y=mid.y;mv(700,true);
      info.head='GREAT DEFENSE!';
      info.line=key==='front'?'前に出て ドライブを とめた！':key==='slide'?'よこに ついて ドライブを とめた！':key==='trust'?'ナイスヘルプ！ みかたが とめてくれた！':key==='cut'?'カットを ふさいで ドライブも とめた！':'ふたりを みて うまく とめた！';
      const outs=scnOpenMates(s);
      if(s.turn<s.maxTurns&&outs.length&&Math.random()<.5){
        passOut(outs[0]);dfnPrepare(s);info.head='とめた！ でも…';info.line+=' パスで べつの てきが フリー！';
      }else if(Math.random()<.55){steal(near(mid),mid,'GREAT DEFENSE!',info.line+' ボールを うばった！');}
      else{shoot(.12);info.line+' むりに うたせた！';info.line+' むりに うたせた！';}
    }else{
      s.off[s.h].x=spc.x;s.off[s.h].y=spc.y;react('drive',true);mv(820,true);
      info.head='ぬかれた！';info.line='てきに ドライブで ぬかれちゃった！';
      if(s.turn>=s.maxTurns||s.time<=0){shoot(clamp(.08+shotQ(s.foes,s.off[s.h])*.011+.2,.1,.9));info.line='てきに ぬかれて、そのまま シュートされた！';}
      else{s.flags.beaten=true;dfnPrepare(s,'shoot');info.line+=' ゴールが あぶない！';}
    }
  }else if(pat==='pass'){
    const t=it.to,R=s.off[t],mine=st.foes[hi].man===t,h=hero();
    if(key==='deny'){const m=lerpP(H0,R,.55);h.x=m.x;h.y=m.y;}
    else if(key==='ball'){goto8(h,H0,8.4);}
    else if(!mine){const g=goalSide(R,8.8);h.x=g.x;h.y=g.y;}
    mv(520);
    if(ok&&(key==='deny'||key==='ball'||mine)){
      const pt=segPoint(h,H0,R);steal(hi,pt,key==='deny'?'PASS CUT!':'GREAT DEFENSE!',key==='deny'?'パスコースを ふさいだ！ パスカット！':'ボールへ とびこんで カット！');
    }else if(ok){
      steps.push({k:'pass',from:s.h,to:t});s.lastPass={from:s.h,to:t,turn:s.turn};s.h=t;react('pass',true);mv(560);
      info.head='ナイスヘルプ！';info.line='パスは とおったけど、すぐ おさえた！';
      if(s.turn<s.maxTurns&&s.time>0)dfnPrepare(s,'shoot');else shoot(.22);
    }else{
      passOut(t);info.head='パスが とおった！';info.line='てきに うまく パスされた！';
      if(s.turn<s.maxTurns&&s.time>0)dfnPrepare(s,'shoot');else{shoot(.55);info.line='てきに うまく パスされて シュートされた！';}
    }
  }else if(pat==='shot'){
    const H=s.off[s.h],h=hero();
    if(key==='check')goto8(h,H,8.0);else if(key==='chase')goto8(h,H,8.3);else{const m=lerpP(h,P(50,17),.5);h.x=m.x;h.y=m.y;}
    mv(520);
    const base=baseMake(),pm=key==='check'?(ok?.1:Math.min(.9,base+.12)):key==='reb'?base*.85:(ok?base*.6:base*.8);
    const made=shoot(pm,{block:key==='check'&&ok&&Math.random()<.4});
    if(made){info.line=key==='check'?'シュートチェックが おくれた…':key==='reb'?'シュートを うたれた…':'おいつけなかった…';}
    else{
      const mine=key==='reb'?.8:key==='check'?(ok?1:.6):.55;
      if(Math.random()>=mine&&Math.random()<.5){steps.push({k:'say',text:'リバウンドを とられた！',cls:'miss'});s.end={type:'rscore',pts:2,by:s.h};info.line='リバウンドを とられて いれられた…';}
      else{info.head=key==='check'?(s.end.block?'SHOT BLOCK!':'SHOT CHECK!'):key==='reb'?'NICE REBOUND!':'GREAT DEFENSE!';info.line=key==='check'?'シュートを じゃました！':key==='reb'?'リバウンドを とった！':'シュートを はずさせた！';}
    }
  }else{ // help
    const h=hero();
    if(key==='help'){goto8(h,s.off[s.h],8.4);}
    else if(key==='back'){const m=lerpP(h,P(50,18),.6);h.x=m.x;h.y=m.y;}
    mv(520);
    if(ok){
      info.head='NICE HELP!';info.line=key==='help'?'ナイスヘルプ！ シュートを じゃました！':'ゴールを まもって シュートを じゃました！';
      const man=st.foes[hi].man;
      if(key==='help'&&s.turn<s.maxTurns&&s.time>0&&man>=0&&man!==s.h&&Math.random()<.45){
        s.flags.beaten=false;passOut(man);dfnPrepare(s,'shoot');info.line='ヘルプで とめたけど、パスで ひとり フリーに！';info.head='とめた！ でも…';
      }else{s.flags.beaten=false;const made=shoot(.15,{block:Math.random()<.4});if(made){info.line='じゃまは したけど、はいっちゃった…';}else if(s.end.block)info.head='BLOCK!';}
    }else{
      s.flags.beaten=false;shoot(.72);info.head='いれられた…';info.line=key==='stay'?'ヘルプに いかなかったから フリーで うたれた！':'ゴールの ちかくで シュートを うたれた！';
    }
  }
  if(!s.end&&s.time<=0){steps.push({k:'say',text:'ブザー！',cls:'combo'});shoot(baseMake()*.8);info.line='じかんぎれ まぎわの シュート！';}
  if(s.end){
    if(s.end.type==='steal'){s.stats.dstop++;s.stats.dsteal++;if(q!=='great')s.stats.smart++;}
    else if(s.end.type==='miss'){s.stats.dstop++;if(ok&&q==='weak')s.stats.good++;}
  }else if(!s.intent){dfnPrepare(s);}
  return {st:s,steps,info};
}
function dfnWrap(s){
  const e=s.end,r={gameOver:false,again:false,clutch:false,scored:0};
  s.poss++;
  if(e.type==='rscore'){s.them+=e.pts;r.scored=e.pts;}
  else if(s.us-s.them>=0&&s.us-s.them<=2&&s.time<=12){s.stats.clutch++;r.clutch=true;}
  if(s.time<3||s.poss>=7)r.gameOver=true;else r.again=true;
  return r;
}
const DFN_COACH={drive:'ドライブは「まえに でる」か「よこに つく」。てきの いく ほうを みよう！',pass:'ボールだけ みない！ パスコースも ふさごう。',shot:'シュートの ときは て を あげて チェック！',help:'ぬかれたら みんなで たすける。ヘルプは だいじ！',two:'ふたりの うごきを みて、あぶない ほうを まもろう。'};
function dfnNarrate(prev,res,wrap){
  const e=res.st.end,i=res.info,out={head:i.head||'GOOD!',cls:'good',line:i.line,coach:DFN_COACH[i.pat]};
  if(e){
    if(e.type==='rscore'){out.head='RED TEAM SCORE!';out.cls='bad';out.coach='ざんねん！ つぎは ちゃんと とめよう！';}
    else if(wrap&&wrap.clutch)out.head='CLUTCH DEFENSE!!';
  }else out.cls=i.ok?'good':'ok';
  return out;
}

</script>

<script id="app">
'use strict';
const $=id=>document.getElementById(id);
/* ---------- save data ---------- */
const SAVE_KEY='bbTactics.v1';
const defSave=()=>({xp:0,answered:0,correct:0,bestCombo:0,themes:{},sound:true,challengeBest:0,scn:{plays:0,wins:0,smart:0,good:0,assist:0,score:0,clutch:0,turnover:0,chalBest:0,dstop:0,dsteal:0}});
function loadSave(){try{const j=JSON.parse(localStorage.getItem(SAVE_KEY));if(j&&typeof j==='object')return Object.assign(defSave(),j);}catch(e){}return defSave();}
let SAVE=loadSave();SAVE.scn=Object.assign(defSave().scn,SAVE.scn||{});
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
const RANKS=[{n:'ROOKIE',xp:0,c:'#8fb4ff'},{n:'STARTER',xp:100,c:'#35ff8a'},{n:'ACE',xp:300,c:'#2ea8ff'},{n:'ALL STAR',xp:600,c:'#ff8a1f'},{n:'COURT MASTER',xp:1000,c:'#ffd23f'}];
const UNLOCK=[0,5,12,22,35];
const rankIdx=xp=>{let i=0;RANKS.forEach((r,k)=>{if(xp>=r.xp)i=k;});return i;};
const unlockedLevel=c=>{let l=1;UNLOCK.forEach((u,i)=>{if(c>=u)l=i+1;});return l;};

 {id:'pass',name:'パス',icon:'🔁',desc:'みかたに ボールを まわそう'},

  good:[[660,0,.09],[880,.09,.09],[1175,.18,.16]],bad:[[330,0,.12],[262,.12,.18]],pass:[[520,0,.06]],
  swish:[[900,0,.05],[1200,.05,.05],[1500,.1,.12]],rank:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]],tap:[[440,0,.04]],

let SFXN=null,SFXLAST={},SFXV=[];
function sfx(kind){
  if(!SAVE.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,now=performance.now();
    if(SFXLAST[kind]&&now-SFXLAST[kind]<60)return;SFXLAST[kind]=now;
    SFXV=SFXV.filter(e=>e>t);if(SFXV.length>14)return;
    const seq=SFXT[kind]||[];
    seq.forEach(([f,d,l,ty,f2,vol])=>{
      const g=AC.createGain(),v=(f==='n'?f2:vol)||.1;
      g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+l);
      let o;
      if(f==='n'){
        if(!SFXN){SFXN=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const a=SFXN.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
        o=AC.createBufferSource();o.buffer=SFXN;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=ty;bp.Q.value=.8;o.connect(bp);bp.connect(g);
      }else{
        o=AC.createOscillator();o.type=ty||(kind==='bad'?'sine':'triangle');o.frequency.setValueAtTime(f,t+d);
        if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d+l);o.connect(g);
      }
      g.connect(AC.destination);o.start(t+d);o.stop(t+d+l+.02);SFXV.push(t+d+l+.02);
    });
  }catch(e){}
}

/* ---------- scene (描画用の状態) ---------- */
let S=null;
function ballPos(h){return {x:h.x+4.2,y:h.y+1.8};}
function loadScene(sc){
  const me={x:sc.me.x,y:sc.me.y,num:sc.me.num,kind:'me'};
  const mates=sc.mates.map(m=>({x:m.x,y:m.y,num:m.num,kind:'mate'}));
  const foes=sc.foes.map(f=>({x:f.x,y:f.y,num:f.num,kind:'foe'}));
  const holder=sc.holder==='me'?me:mates[sc.holder];
  S={me,mates,foes,ball:{x:holder.x,y:holder.y,h:0,holder,dribble:false},arrows:[],rings:[],hint:[],parts:[],t0:performance.now()};
}
/* ---------- renderer ---------- */
const cv=$('court'),ctx=cv.getContext('2d');
let SC=1,DPR=1,K=1,bg=null;
function resizeCourt(){
  const wrap=$('courtWrap'),cw=wrap.clientWidth,ch=wrap.clientHeight;
  if(!cw||!ch)return;
  SC=Math.min(cw/W,ch/H);
  const pw=Math.floor(W*SC),ph=Math.floor(H*SC);
  DPR=Math.min(window.devicePixelRatio||1,2.5);K=SC*DPR;
  const box=$('courtBox');box.style.width=pw+'px';box.style.height=ph+'px';
  if(bg&&cv.width===Math.round(pw*DPR)&&cv.height===Math.round(ph*DPR))return;
  cv.width=Math.round(pw*DPR);cv.height=Math.round(ph*DPR);
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const b=bg.getContext('2d');if(b){b.setTransform(K,0,0,K,0,0);drawCourt(b);}
}
function drawCourt(c){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10285f');g.addColorStop(1,'#071233');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.globalAlpha=.07;c.fillStyle='#4aa8ff';for(let y=0;y<H;y+=8)if((y/8|0)%2)c.fillRect(0,y,W,8);c.globalAlpha=1;
  c.fillStyle='rgba(255,138,31,.17)';c.fillRect(34,1,32,35);
  c.save();c.beginPath();c.rect(1,1,98,86);c.clip();
  c.fillStyle='rgba(46,168,255,.07)';c.beginPath();c.moveTo(9,1);c.lineTo(9,18.1);c.arc(50,9,42,2.923,.2185,true);c.lineTo(91,1);c.closePath();c.fill();c.restore();
  c.save();c.strokeStyle='#8fd8ff';c.lineWidth=.55;c.shadowColor='#2ea8ff';c.shadowBlur=7*K;c.lineJoin='round';
  c.strokeRect(1,1,98,86);
  c.strokeRect(34,1,32,35);
  c.beginPath();c.arc(50,36,11,0,Math.PI);c.stroke();
  c.setLineDash([1.6,1.4]);c.beginPath();c.arc(50,36,11,Math.PI,Math.PI*2);c.stroke();c.setLineDash([]);
  c.beginPath();c.arc(50,9,6,0,Math.PI);c.stroke();
  c.beginPath();c.moveTo(9,1);c.lineTo(9,18.1);c.arc(50,9,42,2.923,.2185,true);c.lineTo(91,1);c.stroke();
  c.beginPath();c.arc(50,87,12,Math.PI,Math.PI*2);c.stroke();
  c.strokeStyle='#fff';c.lineWidth=.9;c.beginPath();c.moveTo(44,4.2);c.lineTo(56,4.2);c.stroke();
  c.strokeStyle='#ff8a1f';c.shadowColor='#ff8a1f';c.lineWidth=.8;c.beginPath();c.moveTo(50,4.2);c.lineTo(50,6.6);c.stroke();
  c.beginPath();c.arc(50,9,2.4,0,Math.PI*2);c.stroke();
  c.restore();
  c.font='bold 2.6px sans-serif';c.fillStyle='rgba(143,216,255,.35)';c.textAlign='center';
  c.fillText('GOAL',50,2.9>0?-.5+4:4);
}
function arrow(c,a,b,col,dash,w){
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);if(l<2)return;
  const ux=dx/l,uy=dy/l,sa={x:a.x+ux*4.6,y:a.y+uy*4.6},eb={x:b.x-ux*(dash===2?0:4.4),y:b.y-uy*(dash===2?0:4.4)};
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w||.9;c.shadowColor=col;c.shadowBlur=8*K;c.lineCap='round';
  if(dash)c.setLineDash([2,1.6]);
  c.beginPath();c.moveTo(sa.x,sa.y);c.lineTo(eb.x,eb.y);c.stroke();c.setLineDash([]);
  const hs=3;c.beginPath();c.moveTo(eb.x+ux*1.2,eb.y+uy*1.2);c.lineTo(eb.x-ux*hs-uy*hs*.6,eb.y-uy*hs+ux*hs*.6);c.lineTo(eb.x-ux*hs+uy*hs*.6,eb.y-uy*hs-ux*hs*.6);c.closePath();c.fill();
  c.restore();
}
function drawPlayer(c,p,t){
  const me=p.kind==='me',r=me?4.4:3.9;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(p.x,p.y+r*.75,r*.95,r*.4,0,0,7);c.fill();
  if(me){const pu=1+Math.sin(t/260)*.07;c.save();c.shadowColor='#ffd23f';c.shadowBlur=14*K;c.strokeStyle='#ffd23f';c.lineWidth=1.1;c.beginPath();c.arc(p.x,p.y,(r+1.5)*pu,0,7);c.stroke();c.restore();}
  const col=p.kind==='foe'?['#ff7a85','#d3182c']:['#5aa6ff','#1243cf'];
  const g=c.createRadialGradient(p.x-r*.35,p.y-r*.4,r*.1,p.x,p.y,r);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);
  c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();
  c.lineWidth=.45;c.strokeStyle='rgba(255,255,255,.9)';c.stroke();
  c.fillStyle='#fff';c.font='bold 4px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(p.num),p.x,p.y+.3);
  if(me){c.fillStyle='#ffd23f';const w=9.6,h=3.8,x=p.x-w/2,y=p.y+r+2.4;c.beginPath();c.rect(x,y,w,h);c.fill();c.fillStyle='#1a1200';c.font='bold 3px sans-serif';c.fillText('YOU',p.x,y+h/2+.2);
    c.fillStyle='#ffd23f';c.beginPath();c.moveTo(p.x-1.3,y);c.lineTo(p.x+1.3,y);c.lineTo(p.x,y-1.5);c.fill();}
  c.textBaseline='alphabetic';
}
function drawBall(c,b,t){
  let x=b.x,y=b.y,h=b.h;
  if(b.holder){const p=ballPos(b.holder);x=p.x;y=p.y;if(b.dribble)h=Math.abs(Math.sin(t/110))*3.2;}
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x,y+2.2,2,.9,0,0,7);c.fill();
  const by=y-h*.6,r=2.2+h*.04;
  c.save();c.shadowColor='#ff8a1f';c.shadowBlur=8*K;
  const g=c.createRadialGradient(x-.7,by-.7,.3,x,by,r);g.addColorStop(0,'#ffb766');g.addColorStop(1,'#e5600b');
  c.fillStyle=g;c.beginPath();c.arc(x,by,r,0,7);c.fill();c.restore();
  c.strokeStyle='#5a2400';c.lineWidth=.25;c.beginPath();c.arc(x,by,r,0,7);c.moveTo(x-r,by);c.lineTo(x+r,by);c.moveTo(x,by-r);c.lineTo(x,by+r);c.stroke();
}
function frame(){
  requestAnimationFrame(frame);
  if(!S||!bg||!$('scGame').classList.contains('active'))return;
  const t=performance.now()-S.t0;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  ctx.setTransform(K,0,0,K,0,0);
  for(const h of S.hint){
    if(h.t==='line')arrow(ctx,h.a,h.b,h.c,h.dash,.6);
    else{ctx.save();ctx.strokeStyle=h.c;ctx.lineWidth=.8;ctx.shadowColor=h.c;ctx.shadowBlur=8*K;ctx.setLineDash([1.6,1.2]);ctx.beginPath();ctx.arc(h.p.x,h.p.y,4.6,0,7);ctx.stroke();ctx.restore();}
  }
  for(const r of S.rings){const pu=1+Math.sin(t/180)*.12;ctx.save();ctx.strokeStyle=r.c;ctx.lineWidth=.9;ctx.shadowColor=r.c;ctx.shadowBlur=10*K;ctx.beginPath();ctx.arc(r.x,r.y,(r.r||5.8)*pu,0,7);ctx.stroke();ctx.restore();}
  for(const a of S.arrows)arrow(ctx,a.a,a.b,a.c,a.dash,a.w);
  const all=[...S.foes,...S.mates,S.me].sort((a,b)=>a.y-b.y);
  for(const p of all)drawPlayer(ctx,p,t);
  drawBall(ctx,S.ball,t);
  if(typeof fxDraw==='function')fxDraw(ctx);
  for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=1;if(p.l<=0){S.parts.splice(i,1);continue;}ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
  ctx.globalAlpha=1;
}
function sparks(x,y,col,n){if(!S||S.parts.length>300)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.3,1.4);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,l:rnd(24,50),c:pick([col,'#fff','#ffd23f','#ff8a1f']),s:rnd(.4,1)});}}
function burst(text,cls){const d=document.createElement('div');d.className='burst '+(cls||'');d.textContent=text;$('fxLayer').appendChild(d);setTimeout(()=>d.remove(),1400);}
function flash(kind){const b=$('courtBox');b.classList.remove('flash-good','flash-bad');void b.offsetWidth;b.classList.add(kind);}

/* ---------- animation sim ---------- */
let curSim=null;
class Sim{
  constructor(s){this.s=s;curSim=this;}
  get dead(){return curSim!==this||this.s!==S;}
  wait(ms){return new Promise(r=>setTimeout(r,this.dead?0:ms));}
  tween(items,ms){return new Promise(res=>{
    if(this.dead){res();return;}
    const st=items.map(i=>({x:i.o.x,y:i.o.y})),t0=performance.now(),self=this;
    (function f(){const k=Math.min(1,(performance.now()-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      items.forEach((it,j)=>{it.o.x=st[j].x+(it.x-st[j].x)*e;it.o.y=st[j].y+(it.y-st[j].y)*e;});
      if(k<1&&!self.dead)requestAnimationFrame(f);else res();})();});}
  fly(to,ms,arc){ms*=(typeof FXSLOW==='number'?FXSLOW:1);return new Promise(res=>{
    const b=this.s.ball;
    if(b.holder){const p=ballPos(b.holder);b.x=p.x;b.y=p.y;b.holder=null;}
    if(this.dead){b.x=to.x;b.y=to.y;res();return;}
    const sx=b.x,sy=b.y,t0=performance.now(),self=this;
    (function f(){const k=Math.min(1,(performance.now()-t0)/ms);b.x=sx+(to.x-sx)*k;b.y=sy+(to.y-sy)*k;b.h=Math.sin(Math.PI*k)*(arc||0);
      if(k<1&&!self.dead)requestAnimationFrame(f);else{b.h=0;res();}})();});}
  say(t,c){if(!this.dead)burst(t,c);}
  spark(x,y,col,n){if(!this.dead)sparks(x,y,col,n);}
}
const drift=(foes,to,amt)=>foes.map(f=>{const l=dist(f,to)||1,m=Math.min(amt,Math.max(0,l-9));return {o:f,x:f.x+(to.x-f.x)/l*m,y:f.y+(to.y-f.y)/l*m};});
const nearestObj=(list,p)=>nearest(list,p).f;
async function passTo(sim,target){sfx('pass');await sim.fly(ballPos(target),520,5);sim.s.ball.holder=target;}
async function doShot(sim,shooter,mode){
  const s=sim.s,b=s.ball;
  if(mode==='block'){
    const f=nearestObj(SHOT_OPP?[s.me,...s.mates]:s.foes,shooter);
    await sim.tween([{o:f,x:shooter.x+(GOAL.x-shooter.x)*.16,y:shooter.y+(GOAL.y-shooter.y)*.16}],260);
    await sim.fly({x:shooter.x+rnd(-12,12),y:shooter.y+rnd(8,14)},420,5);
    if(!(SHOT_OPP&&FXC&&FXC.good))sim.say(SHOT_OPP?'ナイスブロック！':'ブロックされた！',SHOT_OPP?'':'miss');return;
  }
  sfx('pass');
  if(mode==='swish'){
    await sim.fly({x:GOAL.x,y:GOAL.y},780,16);
    sim.spark(GOAL.x,GOAL.y,'#ffd23f',34);if(!sim.dead){sfx('goal3');flash(SHOT_OPP?'flash-bad':'flash-good');if(typeof fxGoal==='function')fxGoal();}
    await sim.fly({x:GOAL.x,y:GOAL.y+6},260,0);
  }else if(mode==='rim'){
    await sim.fly({x:GOAL.x+rnd(-2.5,2.5),y:GOAL.y+.5},760,15);
    await sim.fly({x:GOAL.x+rnd(-12,12),y:GOAL.y+rnd(11,17)},460,6);
    if(!(SHOT_OPP&&FXC&&FXC.good))sim.say('はいらなかった…','miss');
  }else{
    await sim.fly({x:GOAL.x+rnd(-6,6),y:GOAL.y+rnd(-1,2)},760,15);
    await sim.fly({x:GOAL.x+rnd(-18,18),y:GOAL.y+rnd(14,24)},520,7);
    if(!(SHOT_OPP&&FXC&&FXC.good))sim.say('はずれた…','miss');
  }
}
async function playAction(sim,q,key,isCorrect,quiet){
  const sc=q.sc,ev=q.evals[key],s=sim.s,me=s.me,b=s.ball;
  s.arrows=[];s.hint=[];s.rings=[];
  const say=(t,c)=>{if(!quiet)sim.say(t,c);};
  const idx=f=>sc.foes.indexOf(f);
  const foeObj=f=>s.foes[idx(f)]||nearestObj(s.foes,me);
  if(key==='shoot'){
    const mode=isCorrect?'swish':ev.out==='block'?'block':ev.out==='miss'?'miss':'rim';
    await doShot(sim,me,mode);
  }else if(key.startsWith('pass')){
    const m=s.mates[+key.slice(4)];
    if(ev.out==='steal'){
      const f=ev.lf?foeObj(ev.lf):nearestObj(s.foes,lerpP(me,m,.5)),pt=segPoint(f,me,m);
      const to={x:pt.x,y:pt.y};
      await Promise.all([sim.fly(to,400,4),sim.tween([{o:f,x:to.x,y:to.y}],400)]);
      b.holder=f;say('パスを とられた！','miss');
    }else{
      await Promise.all([passTo(sim,m),sim.tween(drift(s.foes,m,2.5),520)]);
      if(isCorrect){
        const d=dist(m,GOAL),mv=Math.min(9,Math.max(0,d-11)),t=mv/(d||1);
        b.dribble=true;await sim.tween([{o:m,x:m.x+(GOAL.x-m.x)*t,y:m.y+(GOAL.y-m.y)*t},...drift(s.foes,GOAL,3)],560);b.dribble=false;
        await doShot(sim,m,'swish');
      }else if(ev.out==='covered'){
        const f=nearestObj(s.foes,m),l=dist(f,m)||1;
        await sim.tween([{o:f,x:m.x+(f.x-m.x)/l*8.4,y:m.y+(f.y-m.y)/l*8.4}],380);
        say('てきに おさえられた！','miss');
      }else{await sim.wait(300);say('つながったけど…','miss');}
    }
  }else if(key.startsWith('dribble')){
    const sp=ev.spot;b.dribble=true;
    if(isCorrect){
      const chase=s.foes.map((f,i)=>{
        if(sc.screen&&i===sc.screen.foe){const S0=s.mates[sc.screen.mate];let tx=f.x+(sp.x-f.x)*.3,ty=f.y+(sp.y-f.y)*.3;const l=dist({x:tx,y:ty},S0);if(l<8.2){tx=S0.x+(tx-S0.x)/(l||1)*8.2;ty=S0.y+(ty-S0.y)/(l||1)*8.2;}return {o:f,x:tx,y:ty};}
        return drift([f],sp,5)[0];});
      await sim.tween([{o:me,x:sp.x,y:sp.y},...chase],820);b.dribble=false;
      if(dist(sp,GOAL)<=30)await doShot(sim,me,'swish');else sim.spark(me.x,me.y,'#35ff8a',22);
    }else if(ev.out==='stop'){
      const f=ev.stopper?foeObj(ev.stopper):nearestObj(s.foes,me),mid=lerpP(me,sp,.55),l=dist(f,mid)||1;
      await sim.tween([{o:me,x:mid.x,y:mid.y},{o:f,x:mid.x+(f.x-mid.x)/l*8.4,y:mid.y+(f.y-mid.y)/l*8.4}],520);
      b.dribble=false;b.holder=f;say('ドリブルを とめられた！','miss');
    }else{
      await sim.tween([{o:me,x:sp.x,y:sp.y},...drift(s.foes,sp,4)],760);b.dribble=false;say('すすめたけど…','miss');
    }
  }else{
    const hold=s.mates[sc.holder],sp=ev.spot,drv=sc.drive,moveMe=key!=='off_stay';
    if(drv&&ev.out==='drive'){
      const mid=lerpP(drv.from,drv.to,.5),tasks=[];
      b.dribble=true;
      if(moveMe)tasks.push({o:me,x:sp.x,y:sp.y});
      tasks.push({o:hold,x:mid.x,y:mid.y});
      await sim.tween(tasks,700);
      const f=nearestObj(s.foes,hold),l=dist(f,hold)||1;
      await sim.tween([{o:f,x:hold.x+(f.x-hold.x)/l*8.4,y:hold.y+(f.y-hold.y)/l*8.4}],360);
      b.dribble=false;b.holder=f;say('じゃまに なっちゃった！','miss');
    }else if(ev.out==='bump'){
      const pt=lerpP(me,sp,.5),f=ev.pathFoe?foeObj(ev.pathFoe):nearestObj(s.foes,pt);
      const l=dist(f,pt)||1;
      await sim.tween([{o:me,x:pt.x,y:pt.y},{o:f,x:pt.x+(f.x-pt.x)/l*8.4,y:pt.y+(f.y-pt.y)/l*8.4}],520);
      say('ぶつかっちゃった！','miss');
    }else{
      const tasks=[];
      if(moveMe)tasks.push({o:me,x:sp.x,y:sp.y});
      if(drv){tasks.push({o:hold,x:drv.to.x,y:drv.to.y});b.dribble=true;}
      if(tasks.length)await sim.tween([...tasks,...(moveMe?drift(s.foes,sp,2):[])],760);else await sim.wait(300);
      b.dribble=false;
      if(ev.out==='steal'){
        const f=ev.lf?foeObj(ev.lf):nearestObj(s.foes,lerpP(hold,me,.5)),pt=segPoint(f,hold,me);
        await Promise.all([sim.fly({x:pt.x,y:pt.y},400,4),sim.tween([{o:f,x:pt.x,y:pt.y}],400)]);
        b.holder=f;say('パスを とられた！','miss');
      }else{
        await passTo(sim,me);
        if(isCorrect){
          const d=dist(me,GOAL),mv=Math.min(8,Math.max(0,d-11)),t=mv/(d||1);
          if(mv>1){b.dribble=true;await sim.tween([{o:me,x:me.x+(GOAL.x-me.x)*t,y:me.y+(GOAL.y-me.y)*t},...drift(s.foes,GOAL,2)],480);b.dribble=false;}
          await doShot(sim,me,'swish');
        }else if(ev.out==='covered'){
          const f=nearestObj(s.foes,me),l=dist(f,me)||1;
          await sim.tween([{o:f,x:me.x+(f.x-me.x)/l*8.4,y:me.y+(f.y-me.y)/l*8.4}],380);say('てきに つかまった！','miss');
        }else{await sim.wait(300);say('つながったけど…','miss');}
      }
    }
  }
  await sim.wait(isCorrect?500:300);
}
function questionArrows(q){const a=[];if(q.sc.drive)a.push({a:q.sc.drive.from,b:q.sc.drive.to,c:'#7fe3ff',dash:true,w:.9});return a;}
function correctArrows(q){
  const sc=q.sc,k=q.correct,ev=q.evals[k],a=[],rings=[];
  if(k==='shoot')a.push({a:sc.me,b:GOAL,c:'#ff8a1f',dash:false});
  else if(k.startsWith('pass')){const m=sc.mates[+k.slice(4)];a.push({a:sc.me,b:m,c:'#ff8a1f',dash:true});rings.push({x:m.x,y:m.y,c:'#35ff8a'});}
  else if(k.startsWith('dribble')){a.push({a:sc.me,b:ev.spot,c:'#ffd23f',dash:false,w:1.1});rings.push({x:ev.spot.x,y:ev.spot.y,c:'#35ff8a',r:4});}

    const h=sc.drive?sc.drive.to:sc.mates[sc.holder];
    if(sc.drive)a.push({a:sc.drive.from,b:sc.drive.to,c:'#7fe3ff',dash:true});
    a.push({a:sc.me,b:ev.spot,c:'#ffd23f',dash:false,w:1.1},{a:h,b:ev.spot,c:'#ff8a1f',dash:true});rings.push({x:ev.spot.x,y:ev.spot.y,c:'#35ff8a',r:4});
  }

}

function fxBolt(p1,p2,col,life,amp){fxAdd({t:'bolt',p1:{x:p1.x,y:p1.y},p2:{x:p2.x,y:p2.y},col,life:life||10,amp:amp||2.2});}
function fxRing(x,y,col,r1,life,lw){fxAdd({t:'ring',x,y,r0:1.5,r1:r1||14,col,life:life||18,lw:lw||1.5});}
function fxGlow(x,y,col,r,life){fxAdd({t:'glow',x,y,col,r:r||10,life:life||14});}
function fxRays(x,y,col,n,len,life){fxAdd({t:'rays',x,y,col,n:n||12,len:len||16,life:life||16,ph:Math.random()*6.28});}
function fxAura(o,col,life){fxAdd({t:'aura',o,col,life:life||40});}
function fxSpeed(a,b,col,n,life){
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,seeds=[];
  for(let i=0;i<(n||7);i++)seeds.push({o:rnd(-5,5),d:rnd(0,6),l:rnd(6,14)});
  fxAdd({t:'speed',x:a.x,y:a.y,ux:dx/l,uy:dy/l,col,seeds,life:life||12});
}
function fxFollow(get,kind,ms,col){
  const s0=S;if(!s0)return;const t0=performance.now();let n=0;
  (function f(){
    if(S!==s0)return;const k=performance.now()-t0;if(k>ms)return;
    const p=get();
    if(p){
      if(kind==='flame'){for(let i=0;i<2;i++)fxAdd({t:'flame',x:p.x+rnd(-1.3,1.3),y:p.y+rnd(.5,2.8),r:rnd(1.2,2.4),life:rnd(12,20),vy:-.09,col});}
      else if((n++&1)===0)fxAdd({t:'ghost',x:p.x,y:p.y,r:kind==='ball'?2.1:3.5,col,life:kind==='ball'?12:14});
    }
    requestAnimationFrame(f);
  })();
}
/* ---------- drawing (called from frame()) ---------- */
function fxDraw(c){
  const a=S&&S.fx;if(!a||!a.length)return;
  c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';
  for(let i=a.length-1;i>=0;i--){
    const e=a[i];e.a++;if(e.a>=e.life){a.splice(i,1);continue;}
    const k=e.a/e.life,al=1-k;
    if(e.t==='bolt'){
      if(!e.pts||e.a%3===0){
        const n=8,dx=e.p2.x-e.p1.x,dy=e.p2.y-e.p1.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;e.pts=[];
        for(let j=0;j<=n;j++){const u=j/n,o=(j===0||j===n)?0:(Math.random()*2-1)*e.amp;e.pts.push({x:e.p1.x+dx*u+nx*o,y:e.p1.y+dy*u+ny*o});}
      }
      c.beginPath();e.pts.forEach((p,j)=>j?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
      c.strokeStyle=e.col;c.lineWidth=2.4;c.globalAlpha=.3*al;c.stroke();
      c.strokeStyle='#fff';c.lineWidth=.6;c.globalAlpha=al;c.stroke();
    }else if(e.t==='ring'){
      const r=e.r0+(e.r1-e.r0)*(1-Math.pow(1-k,2.2));
      c.beginPath();c.arc(e.x,e.y,r,0,6.283);c.strokeStyle=e.col;c.lineWidth=e.lw*(1-k)+.2;c.globalAlpha=al;c.stroke();
      c.beginPath();c.arc(e.x,e.y,r*.82,0,6.283);c.strokeStyle='#fff';c.lineWidth=.4;c.globalAlpha=al*.7;c.stroke();
    }else if(e.t==='glow'){
      const r=e.r*(.6+k*.7),g=c.createRadialGradient(e.x,e.y,0,e.x,e.y,r);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.35,e.col);g.addColorStop(1,'rgba(0,0,0,0)');
      c.globalAlpha=al*.8;c.fillStyle=g;c.beginPath();c.arc(e.x,e.y,r,0,6.283);c.fill();
    }else if(e.t==='rays'){
      c.strokeStyle=e.col;c.lineWidth=.9;c.globalAlpha=al;c.beginPath();
      for(let j=0;j<e.n;j++){const an=e.ph+j*6.283/e.n,r1=e.len*(.25+k*.75),r0=e.len*k*.5;c.moveTo(e.x+Math.cos(an)*r0,e.y+Math.sin(an)*r0);c.lineTo(e.x+Math.cos(an)*r1,e.y+Math.sin(an)*r1);}
      c.stroke();
    }else if(e.t==='speed'){
      c.strokeStyle=e.col;c.lineWidth=.5;c.globalAlpha=al*.85;c.beginPath();
      for(const s of e.seeds){const bx=e.x+(-e.uy)*s.o-e.ux*(s.d+k*8),by=e.y+e.ux*s.o-e.uy*(s.d+k*8);c.moveTo(bx,by);c.lineTo(bx-e.ux*s.l,by-e.uy*s.l);}
      c.stroke();
    }else if(e.t==='ghost'){
      c.globalAlpha=al*.55;c.fillStyle=e.col;c.beginPath();c.arc(e.x,e.y,e.r*(1-k*.4),0,6.283);c.fill();
    }else if(e.t==='flame'){
      e.y+=e.vy*(1+k);e.x+=Math.sin(e.a*.7)*.12;
      c.globalAlpha=al*.9;c.fillStyle=k<.35?'#fff6b0':k<.7?(e.col||'#ff9a2a'):'#ff3b2a';
      c.beginPath();c.arc(e.x,e.y,e.r*(1-k*.6),0,6.283);c.fill();
    }else if(e.t==='aura'){
      const o=e.o,pu=1+Math.sin(e.a*.45)*.1,r=7*pu;
      const g=c.createRadialGradient(o.x,o.y,2,o.x,o.y,r+3);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.7,e.col);g.addColorStop(1,'rgba(0,0,0,0)');
      c.globalAlpha=al*.7;c.fillStyle=g;c.beginPath();c.arc(o.x,o.y,r+3,0,6.283);c.fill();
    }
  }
  c.restore();
}

/* ---------- plan: decide which "special play" this was and how big ---------- */
function fxPlan(side,prev,res,wrap){
  const e=res.st.end,i=res.info,P={on:true,side,q:i.q,good:false,id:null,tier:0,cat:null,key:null,max:false,team:'blue',pts:0,titled:false};
  if(side==='off'){
    const opt=i.opt;P.cat=opt.cat;P.key=opt.key;
    if(e){
      if(e.type==='made'){
        P.good=true;P.pts=e.pts;
        const win=wrap&&wrap.gameOver&&res.st.us>res.st.them&&(res.st.us-e.pts)<=res.st.them;
        if(e.buzzer){P.id='buzzer';P.tier=3;P.max=true;}
        else if(win){P.id='winner';P.tier=3;P.max=true;}
        else if(wrap&&wrap.clutch){P.id='clutch';P.tier=2;}
        else if(e.pts===3){P.id='long';P.tier=1;}
        else if(e.q>=45){P.id='pshot';P.tier=2;}
        else{P.id='nice';P.tier=i.q==='great'?1:0;}
        if(e.by!==0&&!['buzzer','winner','clutch'].includes(P.id)){P.id=e.assist?'assist':'team';P.tier=e.assist?(i.q==='great'?2:1):0;}
      }
    }else if(!i.turnover&&i.q!=='weak'){
      P.good=true;
      if(opt.cat==='off'){
        P.key=opt.key==='off_cut'?'dribble_goal':'dribble_side';P.tier=i.q==='great'?1:0;
        P.id=opt.key==='off_cut'?'cutin':opt.key==='off_ball'?'call':opt.key==='off_stay'?null:'space';
      }else if(opt.cat==='pass'){
        const rv=prev.off[opt.to],free=nearest(prev.foes,rv).d>=FREE_D+4;
        if(i.q==='great'){P.id=free?'perfect':'bullet';P.tier=free?2:1;}
      }else if(opt.cat==='drive'){
        const g=dist(prev.off[prev.h],GOAL)-dist(res.st.off[prev.h],GOAL);
        P.key=g>=4?'dribble_goal':'dribble_side';P.id=g>=4?'drive':'break';P.tier=i.q==='great'?1:0;
      }
    }
  }else{
    P.cat='def';P.key=i.opt.key;
    const blocked=res.steps.some(s=>s.k==='shot'&&s.mode==='block');
    if(e&&e.type==='steal'){P.good=true;P.id=(i.pat==='pass'&&P.key==='deny')?'cut':'steal';P.tier=i.q==='great'?2:1;}
    else if(e&&e.type==='miss'&&(i.ok||blocked)){P.good=true;P.id=blocked?'block':(i.head==='NICE REBOUND!'?'reb':'gdef');P.tier=i.q==='great'?2:1;}
    else if(!e&&i.ok){P.good=true;P.id='lock';P.tier=i.q==='great'?1:0;}
    if(e&&P.good&&wrap&&wrap.clutch){P.id='cdef';P.tier=2;}
  }
  return P;
}
/* ---------- result stage after the animation: title + extras. returns extra wait (ms) ---------- */
function fxResult(P){
  if(!P||!P.good)return 0;
  if(!P.id){sfx('pass2');return 0;}
  const T=TTL[P.id];if(!T)return 0;
  if(!P.titled)fxTitle(T,P.tier,'blue');
  if(P.id==='reb')fxRebound();
  else if(FXSND[P.id]&&P.cat==='def'&&(P.id==='lock'||P.id==='gdef'))sfx('lock');
  if(P.tier>=2&&['clutch','cdef','buzzer','winner'].includes(P.id))sfx('clutch');
  else if(P.tier>=2&&!['steal','cut','block'].includes(P.id))sfx('good');
  return P.tier>=3?500:P.tier>=2?300:0;
}

/* ---------- playback of resolve() steps ---------- */
async function scnPlay(sim,steps,st0){
  const box=$('courtBox'),def=st0.phase==='def',P=FXC&&FXC.on?FXC:null;
  let clashed=false;
  for(const stp of steps){
    if(sim.dead)return;
    if(stp.k==='move'){
      const items=[],arrows=[];
      stp.off.forEach((p,i)=>{
        const o=Z.pl[i];
        if(dist(o,p)>.4){items.push({o,x:p.x,y:p.y});
          if(dist(o,p)>2.5)arrows.push({a:{x:o.x,y:o.y},b:{x:p.x,y:p.y},c:def?'#ff6a77':(i===0?'#ffd23f':'#5aa9ff'),dash:false,w:(def?i===st0.h:i===0)?1.1:.7});}
      });
      stp.foes.forEach((p,i)=>{
        const o=Z.fo[i];
        if(dist(o,p)>.4){items.push({o,x:p.x,y:p.y});
          if(dist(o,p)>2.5)arrows.push({a:{x:o.x,y:o.y},b:{x:p.x,y:p.y},c:def?(i===st0.hi?'#ffd23f':'#5aa9ff'):'#ff6a77',dash:false,w:.7});}
      });
      S.arrows=arrows;S.ball.dribble=!!stp.dribble;
      if(stp.drive){const hd=S.ball.holder;if(hd)sim.spark(hd.x,hd.y,'#ffd23f',14);}
      if(P){
        if(!def&&stp.offball&&P.good){const t=stp.off[0];fxDrive(Z.pl[0],{x:t.x,y:t.y},P.key,P.tier,'blue');}
        else if(!def&&stp.drive&&P.good&&P.cat==='drive'){const o=Z.pl[st0.h],t=stp.off[st0.h];fxDrive(o,{x:t.x,y:t.y},P.key,P.tier,'blue');}
        else if(def&&P.good&&!clashed&&P.side==='def'){clashed=true;fxClash(Z.pl[st0.h],S.me,P.tier);}
        else if(def&&!P.good&&stp.dribble){fxFollow(()=>Z.pl[st0.h],'flame',stp.ms,'#ff6a2a');sfx('drive');}
      }
      await sim.tween(items,stp.ms);
      S.ball.dribble=false;
      await sim.wait(P&&P.tier>=2?200:260);S.arrows=[];
    }else if(stp.k==='pass'){
      const a=Z.pl[stp.from],b=Z.pl[stp.to];
      S.arrows=[{a,b,c:def?'#ff6a77':'#ff8a1f',dash:true,w:.9}];
      if(P)fxPass(a,b,def?'weak':(stp.from!==0?'good':(P.good?P.q:'weak')),def?'red':'blue');
      await passTo(sim,b);S.arrows=[];
      if(P&&!def&&P.good&&stp.from===0)fxArrive(b,P.q,'blue');
    }else if(stp.k==='steal'){
      const f=Z.fo[stp.foe];
      await Promise.all([sim.fly(stp.at,400,4),sim.tween([{o:f,x:stp.at.x,y:stp.at.y}],400)]);
      S.ball.holder=f;
      if(P&&def&&P.good)fxSteal(stp.at,P.tier,'blue');
      else if(P&&!def){fxRing(stp.at.x,stp.at.y,FXCOL.red.m,10,12,1.2);sfx('bad');}
      sim.say(stp.say,'miss');await sim.wait(350);
    }else if(stp.k==='shot'){
      box.classList.add('cam');
      const sh=Z.pl[stp.who],opp=!!stp.opp,made=stp.mode==='swish';
      if(P&&P.max&&made&&!opp){fxDim(true);fxTitle(TTL[P.id],3,'blue');P.titled=true;sfx('clutch');await sim.wait(560);FXSLOW=1.6;}
      if(P)sfx(opp?'pass':'shot');
      if(made)fxFollow(()=>S&&ballNow(),'flame',1300,opp?'#ff6a2a':(P&&P.tier>=1?'#ffb040':'#9fd8ff'));
      else if(stp.mode==='block'){
        const hp={x:sh.x+(GOAL.x-sh.x)*.16,y:sh.y+(GOAL.y-sh.y)*.16};
        setTimeout(()=>{if(S&&!sim.dead){if(opp)fxBlockHit(hp,P?P.tier:1);else{fxRing(hp.x,hp.y,FXCOL.red.m,12,14,1.4);fxShake(1);sfx('bad');}}},270);
      }
      SHOT_OPP=opp;try{await doShot(sim,sh,stp.mode);}finally{SHOT_OPP=false;FXSLOW=1;}
      setTimeout(()=>box.classList.remove('cam'),500);
    }else if(stp.k==='say'){
      sim.say(stp.text,stp.cls);await sim.wait(450);
    }
  }
  await sim.wait(250);
}

  const hi=scnUnlocked(SAVE.scn.plays);
  Z={run:{},mode:'chal',lv:Math.max(2,hi),sel:'auto',st:null,st0:null,options:[],busy:false,combo:0,hint:false,pending:null,num:0,pl:[],fo:[],
     chal:{i:1,total:10,pts:0,spec:CHAL_SPECS[0],stats:SCN_ZERO()}};
  Z.st=chalMake();Z.st0=Z.st;enterScn();
}
function chalNext(){
  const c=Z.chal;c.i++;c.spec=CHAL_SPECS[c.i-1];Z.run={};Z.st=chalMake();scnBegin(false,'ATTACK '+c.i+'!');
}
function chalFinish(){
  const c=Z.chal,k=c.stats,pts=c.pts,i=pts>=16?4:pts>=12?3:pts>=8?2:pts>=4?1:0,r=RANKS[i],before=rankIdx(SAVE.xp);
  const xp=pts*10+k.smart*4+k.assist*10+20;
  SAVE.xp+=xp;if(pts>SAVE.scn.chalBest)SAVE.scn.chalBest=pts;
  ['smart','good','assist','score','clutch','turnover'].forEach(x=>{SAVE.scn[x]+=k[x];});persist();updateHudS();
  if(rankIdx(SAVE.xp)>before){sfx('rank');const rr=RANKS[rankIdx(SAVE.xp)];showMsg({title:'RANK UP!',rank:rr.n,color:rr.c,body:'ランクが あがったよ！ すごい！'});}
  sfx(pts>=8?'rank':'good');
  const bd=[['🏀','SCORE',k.score],['🤝','ASSIST',k.assist],['🧠','SMART PLAY',k.smart],['🔥','CLUTCH',k.clutch]].filter(x=>x[2]).map(x=>'<span class="badge">'+x[0]+' '+x[1]+' <b>×'+x[2]+'</b></span>').join('');
  showMsg({title:'RESULT',rank:r.n,color:r.c,body:'10かいの こうげきで <b style="color:#ffd23f;font-size:24px">'+pts+'</b> てん！<br>+'+xp+' XP</div><div class="badges" style="margin-top:8px">'+bd+'<div>',
    ok:'もういちど ちょうせん',cb:startChallenge,ok2:'タイトルへ',cb2:()=>goTitle()});
}
/* ---------- hint / stats / wiring ---------- */
function fillScnStats(){
  const k=SAVE.scn,box=$('stScn');box.innerHTML='';
  const h=document.createElement('div');h.style.cssText='font-weight:900;color:#ffd23f;font-size:13px;margin-bottom:6px';h.textContent='GAME SCENARIO';box.appendChild(h);
  const g=document.createElement('div');g.className='grid3';
  [[k.plays,'プレー'],[k.wins,'しょうり'],[k.smart,'SMART PLAY'],[k.assist,'ASSIST'],[k.score,'SCORE'],[k.clutch,'CLUTCH'],[k.dstop,'ナイス まもり'],[k.dsteal,'STEAL'],[k.good,'GOOD PLAY']].forEach(([n,l])=>{const d=document.createElement('div');const b=document.createElement('b');b.textContent=n;const s=document.createElement('span');s.textContent=l;d.appendChild(b);d.appendChild(s);g.appendChild(d);});
  box.appendChild(g);
  const p=document.createElement('div');p.style.cssText='font-size:12px;margin-top:8px;font-weight:700;color:#cfe3ff';p.textContent='10 CHALLENGE ベスト: '+k.chalBest+'てん ／ いまの かいほう: LV'+scnUnlocked(k.plays);box.appendChild(p);
}
$('btnSHint').onclick=()=>{
  if(!Z||Z.busy||Z.hint||!S)return;
  Z.hint=true;sfx('tap');$('btnSHint').disabled=true;
  const f=document.createElement('div');f.className='fopp';f.style.color='#35ff8a';
  if(Z.st.phase==='def')f.textContent='💡 '+dfnHintText(Z.st,Z.options);
  else{S.hint=scnHintDraw(Z.st,Z.options);f.textContent='💡 みどりの せんは チャンス！ きいろは ちょっと…、あかは あぶない！';}$('sFeed').appendChild(f);
};
$('sNext').onclick=()=>{if(!Z||Z.busy||!Z.pending)return;const f=Z.pending;Z.pending=null;Z.busy=true;f();};

</script>
